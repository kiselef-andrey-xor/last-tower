      const sp = near ? 460 : 120;
      const k = 1 - Math.exp(-dt * (near ? 7 : 2.2));
      p.vx = lerp(p.vx, Math.cos(a) * sp, k);
      p.vy = lerp(p.vy, Math.sin(a) * sp, k);
    } else {
      p.vx *= 0.94; p.vy *= 0.94;
    }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (d < T.r + 8) {
      if (p.kind === 'coin') {
        addCoins(p.val);
        floatText(p.x, p.y - 8, '+' + p.val, '#ffd23f', 12);
        Sfx.coin();
        spark(p.x, p.y, '#ffd23f', 3, 60);
      } else {
        healTower(p.val);
        floatText(p.x, p.y - 8, '+' + p.val + ' HP', '#7bd948', 14);
        Sfx.heal();
        burst(p.x, p.y, 10, '#7bd948', 70);
      }
      G.pickups.splice(i, 1);
    } else if (p.t > 26) G.pickups.splice(i, 1);
  }
}

/* ---------- ЧАСТИЦЫ / ТЕКСТ ---------- */
function spark(x, y, color, n = 4, spd = 90) {
  if (G.parts.length > 620) return;
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(spd * 0.3, spd);
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.16, 0.4), max: 0.4, r: rand(1.2, 2.8), color, kind: 'spark' });
  }
}
function burst(x, y, n, color, spd) {
  if (G.parts.length > 620) n = Math.min(n, 6);
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(spd * 0.25, spd);
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.3, 0.8), max: 0.8, r: rand(1.6, 4.2), color, kind: 'spark' });
  }
  for (let i = 0; i < Math.min(6, n / 3); i++) {
    const a = rand(0, TAU), s = rand(6, 30);
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.5, 1.1), max: 1.1, r: rand(6, 16), color: '#6b7280', kind: 'smoke' });
  }
}
function ring(x, y, r, color, life) {
  G.parts.push({ x, y, vx: 0, vy: 0, life, max: life, r, color, kind: 'ring' });
}
function floatText(x, y, text, color, size) {
  if (G.texts.length > 70) G.texts.shift();
  G.texts.push({ x, y, text: String(text), color, size: size || 13, life: 0.85, max: 0.85, vy: -34 });
}
function shake(n) { if (SAVE.shake) G.shake = Math.min(26, G.shake + n); }

function updateParticles(dt) {
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const p = G.parts[i];
    p.life -= dt;
    if (p.life <= 0) { G.parts.splice(i, 1); continue; }
    if (p.kind !== 'ring') {
      p.x += p.vx * dt; p.y += p.vy * dt;
      const k = p.kind === 'smoke' ? 0.6 : 3.2;
      p.vx -= p.vx * Math.min(1, dt * k);
      p.vy -= p.vy * Math.min(1, dt * k);
      if (p.kind === 'smoke') p.r += dt * 16;
    } else p.r += dt * 190;
  }
  for (let i = G.texts.length - 1; i >= 0; i--) {
    const t = G.texts[i];
    t.life -= dt;
    if (t.life <= 0) { G.texts.splice(i, 1); continue; }
    t.y += t.vy * dt; t.vy *= 1 - Math.min(1, dt * 2.4);
  }
  for (let i = G.arcs.length - 1; i >= 0; i--) {
    G.arcs[i].life -= dt;
    if (G.arcs[i].life <= 0) G.arcs.splice(i, 1);
  }
}

/* ---------- ВОЛНЫ ---------- */
function startWave() {
  if (G.state !== 'build') return;
  G.wave++;
  G.stats.waves = G.wave;
  const bonus = Math.floor(G.buildT / 3);
  if (bonus > 0 && G.wave > 1) { addCoins(bonus); UI.toast('Быстрый старт: +' + bonus + ' монет'); }
  G.state = 'wave';
  YA.gameplayStart();   // Яндекс Игры: граница геймплея (реклама не мешается)
  G.queue = buildWave(G.wave, G.diff);
  const isBoss = G.wave % 5 === 0;
  if (isBoss) {
    G.queue.unshift({ t: 'boss', at: 1.4, ang: rand(0, TAU) });
    // свита пореже: главная угроза — сам босс
    G.queue = G.queue.filter((q, i) => i === 0 || (q.at > 3.0 && chance(0.45)));
    for (const q of G.queue) if (q !== G.queue[0]) q.at += 1.5;
  }
  G.waveCount = G.queue.length;
  G.waveKilled = 0;
  G.waveT = 0;
  G.waveTimedOut = false;
  G.spawnT = 0;
  G.placing = null;
  G.nextComp = waveComp(G.wave + 1);
  Sfx.waveStart();
  if (isBoss) UI.banner('ВОЛНА ' + G.wave, 'ИДЁТ БОСС', '#ff5566');
  else UI.banner('ВОЛНА ' + G.wave, nextWaveHint(), '#8ff0ff');
  // лавка не закрывается и не сворачивается: во время волны она остаётся
  // открытой (покупки доступны и в бою), ассортимент обновляется в конце волны
  UI.renderShop();
  UI.hudAll();
}

function nextWaveHint() {
  const w = G.wave + 1;
  if (w % 5 === 0) return '⚠ Следующая волна — БОСС';
  const q = buildWave(w, G.diff);
  const counts = {};
  for (const s of q) counts[s.t] = (counts[s.t] || 0) + 1;
  const keys = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 3);
  return keys.map(k => ENEMIES[k].name + ' ×' + counts[k]).join('  ·  ');
}

function waveCleared() {
  // серебро за волну НЕ зависит от сложности: одинаково на Обычной и на Аду
  const bonus = Math.round((14 + G.wave * 5) * (G.S.silverMult || 1));
  let farmIncome = 0;
  for (const s of G.structs) {
    if (s.dead || s.key !== 'farm') continue;
    farmIncome += Math.round((s.def.income + G.wave * 2) * G.S.goldMult);
  }
  addCoins(bonus + farmIncome);
  const repair = Math.round(G.tower.maxHp * 0.05);
  if (G.tower.hp > 0) healTower(repair);
  G.state = 'build';
  G.buildT = BUILD_TIME;
  G.rerollsLeft = G.S.rerolls;
  G.rerollsUsed = 0;
  G.nextComp = waveComp(G.wave + 1);
  rollShelf(true);
  if (farmIncome > 0) UI.toast('Золотые жилы принесли +' + farmIncome);
  if (repair > 0 && G.tower.hp < G.tower.maxHp) UI.toast('Полевой ремонт: +' + repair + ' HP');
  UI.banner('ВОЛНА ' + G.wave + ' ОТБИТА', '+' + (bonus + farmIncome) + ' монет', '#5ee08a');
  Sfx.levelup();
  UI.openShop();          // ассортимент обновился (rollShelf выше)
  UI.hudAll();
}

function updateWave(dt) {
  if (G.state !== 'wave') return;
  G.spawnT += dt;
  G.waveT = (G.waveT || 0) + dt;
  // лимит длины волны: спавн_stop, остатки отступают, идёт подготовка к новой
  if (!G.waveTimedOut && G.waveT >= WAVE_TIME_LIMIT) {
    G.waveTimedOut = true;
    G.queue.length = 0;
    for (const e of G.enemies) if (!e.boss && !e.dead) e.flee = true;
    UI.banner('ВРЕМЯ ВОЛНЫ ВЫШЛО', 'враги отступают — готовится новая волна', '#ffcc55');
  }
  while (G.queue.length && G.queue[0].at <= G.spawnT) {
    const s = G.queue.shift();
    if (s.t === 'boss') spawnBoss(bossForWave(G.wave));
    else {
      const x = Math.cos(s.ang) * SPAWN_R, y = Math.sin(s.ang) * SPAWN_R;
      const e = spawnEnemy(s.t, x, y, s.ang + Math.PI);
      if (e) { portal(x, y, e.def.color); }
    }
  }
  if (!G.queue.length && !G.enemies.length) waveCleared();
  
  // Автозакупщик: покупает самое дорогое доступное улучшение (постройки не трогает — их ставит игрок)
  if (G.S.autoBuy) {
    G.autoBuyTimer = (G.autoBuyTimer || 0) + dt;
    // PRO-версия из лаборатории (SAVE.lab) покупает в 2.5 раза чаще
    const interval = (SAVE.lab && SAVE.lab['l_autobuy']) ? 1.2 : 3.0;
    if (G.autoBuyTimer >= interval) {
      G.autoBuyTimer = 0;
      let bestIdx = -1, bestPrice = 0;
      for (let i = 0; i < G.shelf.length; i++) {
        const slot = G.shelf[i];
        if (!slot) continue;
        const def = SHOP_BY_ID[slot.id];
        if (!def || def.kind) continue;                    // постройки и расходники пропускаем
        const lv = G.levels[def.id] || 0;
        if (lv >= def.max) continue;
        const price = shopCost(def, lv, G.wave, G.S.priceMult);
        if (price <= G.purse && price > bestPrice) {       // кошелёк забега — G.purse
          bestPrice = price;
          bestIdx = i;
        }
      }
      if (bestIdx >= 0) buyShelf(bestIdx);
    }
  }
  
  UI.hudWave();
  UI.renderEnemies();
}

function portal(x, y, color) {
  ring(x, y, 34, color, 0.5);
  burst(x, y, 8, color, 70);
}

/* ---------- ОРБИТАЛЬНЫЙ УДАР ---------- */
function tryStrike(x, y) {
  if (G.strike.cd > 0) { Sfx.deny(); UI.toast('Орбитальный удар перезаряжается'); return; }
  G.strike.cd = G.S.strikeCd;
  G.strike.aiming = false;
  const dmg = G.S.strikeDmg * (1 + G.S.dmg / 22);
  const r = G.S.strikeRadius;
  // предупреждение и задержка удара
  G.parts.push({ x, y, vx: 0, vy: 0, life: 0.55, max: 0.55, r, color: '#ff5566', kind: 'strikeWarn' });
  const delay = Math.round(550 / clamp(G.speed || 1, 0.5, 5));   // на замедлении удар ждёт дольше в реальном времени
  const fire = () => {
    if (!G || G.state === 'dead') return;
    if (G.state === 'paused') { setTimeout(fire, 150); return; }   // во время паузы удар не падает
    aoe(x, y, r, dmg, '#ffd23f');
    ring(x, y, r, '#ffb066', 0.55);
    ring(x, y, r * 0.6, '#fff3c4', 0.35);
    burst(x, y, 40, '#ff9944', 260);
    G.parts.push({ x, y, vx: 0, vy: 0, life: 0.5, max: 0.5, r: r * 1.6, color: '#ffe6b0', kind: 'beam' });
    shake(20);
    G.flash = 0.4; G.flashColor = '#ffd9a0';
    Sfx.strike();
    UI.hudAbility();
  };
  setTimeout(fire, delay);
  Sfx.tone(1500, 0.5, 'sine', 0.06, 200);
  UI.hudAbility();
}

/* ---------- ГЛАВНЫЙ ЦИКЛ ----------
   Симуляция идёт фиксированными шагами 1/60: скорость ×N просто увеличивает
   число шагов за кадр (без взрыва физики на больших dt). */
let lastT = 0, frameDt = 0.016, simAcc = 0;
const SIM_STEP = 1 / 60;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!lastT) lastT = ts;
  let dt = (ts - lastT) / 1000;
  lastT = ts;
  frameDt = clamp(dt, 0.001, 0.1);
  Sfx.budget = 12;
  if (dt > 0.05) dt = 0.05;
  if (G && G.state !== 'menu') {
    if (G.state === 'paused') {
      simAcc = 0;
    } else {
      const sdt = dt * (G.slowmo || 1) * (G.speed || 1);
      G.time += sdt;
      if (G.state !== 'dead') G.runTime += dt;
      simAcc += sdt;
      let n = 0;
      while (simAcc >= SIM_STEP && n < 12) { update(SIM_STEP, SIM_STEP); simAcc -= SIM_STEP; n++; }
      if (n >= 12) simAcc = 0;   // защита от спирали смерти на очень слабых машинах
    }
  }
  if (G && G.state !== 'menu') { UI.hudHp(); UI.hudAbility(); }   // полоска HP и откат удара живые каждый кадр
  render();
  flushSave();
}

function update(dt, rdt) {
  if (G.state === 'dead') {
    updateParticles(dt);
    if (G.slowmo < 1) G.slowmo = Math.min(1, G.slowmo + rdt * 0.6);
    return;
  }
  if (G.state === 'paused') return;

  if (G.state === 'build') {
    G.buildT -= rdt;
    if (G.buildT <= 0) { G.buildT = 0; startWave(); }
    else if (G.buildT < 6 && Math.floor(G.buildT) !== Math.floor(G.buildT + rdt)) Sfx.tick();
    UI.hudBuild();
  } else if (G.state === 'wave') {
    updateWave(dt);
  }

  updateEnemies(dt);
  updateBullets(dt);
  updateEBullets(dt);
  updateStructs(dt);
  updateTowerSystems(dt);
  updatePickups(dt);
  updateParticles(dt);

  if (G.shake > 0) G.shake = Math.max(0, G.shake - rdt * 42);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - rdt * 1.6);
}

/* ---------- КОНЕЦ ЗАБЕГА ---------- */
function gameOver() {
  if (G.state === 'dead') return;
  G.state = 'dead';
  YA.gameplayStop();
  G.slowmo = 0.25;
  const T = G.tower;
  burst(T.x, T.y, 70, '#ff9944', 320);
  burst(T.x, T.y, 40, '#ffd23f', 220);
  ring(T.x, T.y, 220, '#ff6b3d', 0.9);
  shake(30);
  G.flash = 0.8; G.flashColor = '#ff8855';
  Sfx.gameOver();
  Sfx.boom();

  const reward = bankRunProgress();        // награда и рекорды
  const transfer = bankRunCoins();         // непотраченная добыча забега → в кошелёк
  flushSave();   // критический момент: сейвим сразу, не ждём следующий кадр
  setTimeout(() => UI.showResults(reward, transfer, G.transferSilver || 0), 1200);
}

/* ---------- ВВОД ---------- */
function screenToWorld(sx, sy) {
  const v = G.view;
  return { x: (sx - v.cx) / v.scale, y: (sy - v.cy) / v.scale };
}

function onPointerMove(sx, sy) {
  if (!G) return;
  G.mouse.x = sx; G.mouse.y = sy;
  const w = screenToWorld(sx, sy);
  G.mouse.wx = w.x; G.mouse.wy = w.y;
  G.strike.x = w.x; G.strike.y = w.y;
}

function onPointerDown(sx, sy, btn) {
  if (!G) return;
  Sfx.resume();
  onPointerMove(sx, sy);
  if (G.state === 'dead') return;
  const w = screenToWorld(sx, sy);
  if (btn === 2) { G.placing = null; G.strike.aiming = false; UI.renderInv(); return; }
  if (G.strike.aiming) { tryStrike(w.x, w.y); return; }
  if (G.state === 'wave' || G.state === 'build') {
    const e = enemyAt(w.x, w.y);
    if (e) {
      G.focus = e;
      floatText(e.x, e.y - e.r - 14, 'ЦЕЛЬ!', '#ff8899', 13);
      ring(e.x, e.y, e.r + 10, '#ff5566', 0.4);
      Sfx.tone(880, 0.07, 'square', 0.06, 1200);
      return;
    }
  }
  if (G.placing) {
    if (placeStruct(G.placing, w.x, w.y)) { /* ok */ }
    else { Sfx.deny(); UI.toast('Здесь нельзя строить'); }
    return;
  }
}

function bindInput() {
  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    onPointerMove(e.clientX - r.left, e.clientY - r.top);
  });
  canvas.addEventListener('mousedown', e => {
    const r = canvas.getBoundingClientRect();
    onPointerDown(e.clientX - r.left, e.clientY - r.top, e.button);
  });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('touchstart', e => {
    if (!e.touches.length) return;
    const r = canvas.getBoundingClientRect();
    const t = e.touches[0];
    onPointerDown(t.clientX - r.left, t.clientY - r.top, 0);
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    if (!e.touches.length) return;
    const r = canvas.getBoundingClientRect();
    const t = e.touches[0];
    onPointerMove(t.clientX - r.left, t.clientY - r.top);
    e.preventDefault();
  }, { passive: false });

  window.addEventListener('keydown', e => {
    if (!G) return;
    const k = e.key.toLowerCase();
    if (k === ' ' || e.code === 'Space') {
      e.preventDefault();
      if (G.state === 'dead') return;
      if (G.strike.cd <= 0) { G.strike.aiming = !G.strike.aiming; UI.hudAbility(); }
      else { Sfx.deny(); UI.toast('Удар перезаряжается'); }
      return;
    }
    if (k === 'q' || k === 'e' || k === 'tab') {
      e.preventDefault();
      cycleTarget(k === 'q' ? -1 : 1);
      return;
    }
    if (k >= '1' && k <= '9') {
      const n = parseInt(k, 10) - 1;
      if (G.state === 'build' || G.state === 'wave') buyShelf(n);
      return;
    }
    if (k === 'r') { if (G.state === 'build' || G.state === 'wave') rerollShelf(); return; }
    if (k === 'f') { cycleSpeed(); return; }
    if (k === 'enter') { if (G.state === 'build') startWave(); return; }
    if (k === 'escape') {
      if (G.placing) { G.placing = null; UI.renderInv(); return; }
      if (G.strike.aiming) { G.strike.aiming = false; UI.hudAbility(); return; }
      if (G.state === 'paused') { togglePause(); return; }   // ESC снимает паузу
      if (UI.modalOpen) return;                              // открытая модалка обрабатывает ESC сама
      if (G.state === 'wave' || G.state === 'build') togglePause();
      return;
    }
    if (k === 'p') {
      if (G.state === 'paused') { togglePause(); return; }
      if (UI.modalOpen) return;
      if (G.state === 'wave' || G.state === 'build') togglePause();
      return;
    }
  });

  window.addEventListener('resize', resize);
  window.addEventListener('blur', () => { if (G && (G.state === 'wave')) togglePause(true); });
}

function enemyAt(x, y) {
  let best = null, bd = 1e9;
  for (const e of G.enemies) {
    if (e.dead) continue;
    const d = dist(x, y, e.x, e.y);
    if (d < e.r + 14 && d < bd) { bd = d; best = e; }
  }
  return best;
}

function cycleTarget(dir) {
  G.targetMode = (G.targetMode + dir + TARGET_MODES.length) % TARGET_MODES.length;
  Sfx.tone(620, 0.05, 'square', 0.05, 900);
  UI.hudTarget();
}

function togglePause(force) {
  if (!G) return;
  if (G.state === 'paused') {
    G.state = G.prevState || 'wave'; UI.closePause();
    if (G.state === 'wave') YA.gameplayStart();
  } else if (G.state === 'wave' || G.state === 'build') {
    G.prevState = G.state; G.state = 'paused'; UI.openPause();
    YA.gameplayStop();
  }
}

/* ---------- РАЗМЕР ---------- */
function resize() {
  if (!canvas) return;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  if (!G) return;
  const hasUI = (typeof UI !== 'undefined') && UI.panelWidth;
  const panel = hasUI ? UI.panelWidth() : 0;
  const availW = Math.max(320, W - panel);
  const availH = Math.max(320, H - (hasUI ? UI.bottomPad() : 0));
  const phonePortrait = W < 980 && W < H;
  // в портрете арена растягивается почти до краёв экрана (меньше мировой размах)
  const span = phonePortrait ? 1040 : 0;
  const scale = clamp(Math.min(availW / (span || SPAN_X), availH / (span || SPAN_Y)), 0.28, 1.25);
  G.view.scale = scale;
  G.view.cx = panel / 2 + availW / 2;
  // на телефоне в портрете опускаем башню на ~8% высоты: сверху HUD, снизу лавка
  G.view.cy = availH / 2 + (phonePortrait ? H * 0.08 : 0);
}


/* ===== render.js ===== */
/* =========================================================
   RENDER: вся отрисовка (canvas 2D, без внешних ресурсов)
   ========================================================= */
'use strict';

/* Кэш спрайтов свечения */
const _glow = new Map();
function glowSprite(color) {
  let c = _glow.get(color);
  if (c) return c;
  const S = 64;
  c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  gr.addColorStop(0, hexA(color, 1));
  gr.addColorStop(0.35, hexA(color, 0.45));
  gr.addColorStop(1, hexA(color, 0));
  g.fillStyle = gr;
  g.fillRect(0, 0, S, S);
  _glow.set(color, c);
  return c;
}
function hexA(hex, a) {
  if (hex.startsWith('rgba') || hex.startsWith('rgb(')) return hex;
  let h = hex.replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const n = parseInt(h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function glow(x, y, r, color, alpha = 0.8) {
  const s = glowSprite(color);
  ctx.globalAlpha = alpha;
  ctx.drawImage(s, x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = 1;
}

/* Звёздный фон (кэш) */
let _stars = null, _starsKey = '';
function starLayer() {
  const key = W + 'x' + H;
  if (_stars && _starsKey === key) return _stars;
  const c = document.createElement('canvas');
  c.width = Math.max(2, Math.floor(W * 0.5)); c.height = Math.max(2, Math.floor(H * 0.5));
  const g = c.getContext('2d');
  g.fillStyle = '#070b14';
  g.fillRect(0, 0, c.width, c.height);
  for (let i = 0; i < 260; i++) {
    const x = Math.random() * c.width, y = Math.random() * c.height;
    const r = Math.random() * 1.3 + 0.25;
    const a = Math.random() * 0.5 + 0.15;
    g.fillStyle = `rgba(${180 + Math.random() * 60 | 0},${200 + Math.random() * 50 | 0},255,${a})`;
    g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  // туманности
  for (let i = 0; i < 5; i++) {
    const x = Math.random() * c.width, y = Math.random() * c.height;
    const r = 90 + Math.random() * 180;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    const col = ['#2a3f7a', '#4a2a6a', '#1e5a63', '#6a2a3f'][(Math.random() * 4) | 0];
    gr.addColorStop(0, hexA(col, 0.16));
    gr.addColorStop(1, hexA(col, 0));
    g.fillStyle = gr;
    g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  _stars = c; _starsKey = key;
  return c;
}

let menuT = 0;
function renderMenuBg(dt) {
  menuT += (dt || frameDt || 0.016);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const s = starLayer();
  ctx.drawImage(s, 0, 0, W, H);
  ctx.save();
  ctx.translate(W / 2, H * 0.52);
  const sc = Math.min(W, H) / 900;
  ctx.scale(sc, sc);
  ctx.globalAlpha = 0.5;
  for (let i = 0; i < 3; i++) {
    ctx.strokeStyle = hexA('#3d6ea5', 0.25 - i * 0.05);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 200 + i * 90, menuT * (0.1 + i * 0.05), menuT * (0.1 + i * 0.05) + 4.2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // декоративная башня
  const fake = { x: 0, y: 0, r: 30, angle: menuT * 0.5, recoil: 0, hitFlash: 0, pulse: (Math.sin(menuT * 2) + 1) / 2, hp: 100, maxHp: 100, shield: 0 };
  drawTowerShape(fake, { projectiles: 2, orbitals: 0, range: 0, slowAura: 0, burnAura: 0, auraRadius: 0 }, menuT);
  ctx.restore();
}

/* ============ ОСНОВНАЯ ОТРИСОВКА ============ */
function render() {
  if (!G) { renderMenuBg(frameDt); return; }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.drawImage(starLayer(), 0, 0, W, H);

  const v = G.view;
  const sh = G.shake;
  const ox = sh ? rand(-sh, sh) * 0.5 : 0;
  const oy = sh ? rand(-sh, sh) * 0.5 : 0;

  ctx.save();
  ctx.translate(v.cx + ox, v.cy + oy);
  ctx.scale(v.scale, v.scale);

  drawArena();
  drawRanges();
  drawStructs();
  drawPickups();
  drawEnemies();
  drawBullets();
  drawTower();
  drawOrbitals();
  drawParticles();
  drawArcs();
  drawTexts();
  drawGhost();
  drawStrikeAim();

  ctx.restore();

  drawOverlay();
  if (typeof UI !== 'undefined' && UI.bossTick) UI.bossTick();
}

function drawArena() {
  const t = G.time;
  // зона спавна (тёмное кольцо)
  ctx.fillStyle = 'rgba(10,14,24,0.72)';
  ctx.beginPath(); ctx.arc(0, 0, SPAWN_R + 70, 0, TAU); ctx.fill();

  // пол арены
  const gr = ctx.createRadialGradient(0, 0, 40, 0, 0, ARENA_R);
  gr.addColorStop(0, '#1b2740');
  gr.addColorStop(0.65, '#141d31');
  gr.addColorStop(1, '#0e1526');
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.arc(0, 0, ARENA_R, 0, TAU); ctx.fill();

  // сетка
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, ARENA_R, 0, TAU); ctx.clip();
  ctx.strokeStyle = 'rgba(120,170,220,0.07)';
  ctx.lineWidth = 1;
  for (let r = 80; r < ARENA_R; r += 80) { ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke(); }
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * TAU;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * ARENA_R, Math.sin(a) * ARENA_R); ctx.stroke();
  }
  // плитки-акценты
  ctx.fillStyle = 'rgba(120,180,240,0.03)';
  for (let i = 0; i < 26; i++) {
    const a = (i / 26) * TAU + 0.12, r = 150 + (i % 4) * 80;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * r, Math.sin(a) * r, 26, 0, TAU);
    ctx.fill();
  }
  ctx.restore();

  // граница арены
  ctx.strokeStyle = hexA('#4f8fd6', 0.55 + Math.sin(t * 1.6) * 0.12);
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, ARENA_R, 0, TAU); ctx.stroke();
  ctx.strokeStyle = hexA('#8ff0ff', 0.12);
  ctx.lineWidth = 10;
  ctx.beginPath(); ctx.arc(0, 0, ARENA_R + 6, 0, TAU); ctx.stroke();

  // ворота спавна
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * TAU + t * 0.03;
    const x = Math.cos(a) * SPAWN_R, y = Math.sin(a) * SPAWN_R;
    ctx.save();
    ctx.translate(x, y); ctx.rotate(a);
    ctx.strokeStyle = hexA('#ff6b7a', 0.28 + Math.sin(t * 2 + i) * 0.1);
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 26, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 34, -0.6, 0.6); ctx.stroke();
    ctx.restore();
  }
  ctx.strokeStyle = 'rgba(255,107,122,0.13)';
  ctx.lineWidth = 2;
  ctx.setLineDash([14, 12]);
  ctx.beginPath(); ctx.arc(0, 0, SPAWN_R, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
}

function drawRanges() {
  const S = G.S;
  // радиус стрельбы
  ctx.save();
  ctx.strokeStyle = hexA('#8ff0ff', 0.16);
  ctx.lineWidth = 1.5;
  ctx.setLineDash([9, 9]);
  ctx.beginPath(); ctx.arc(0, 0, S.range, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
  if (S.slowAura > 0 || S.burnAura > 0) {
    ctx.fillStyle = S.burnAura > 0 ? 'rgba(255,120,60,0.05)' : 'rgba(120,200,255,0.05)';
    ctx.beginPath(); ctx.arc(0, 0, S.auraRadius, 0, TAU); ctx.fill();
    ctx.strokeStyle = S.burnAura > 0 ? 'rgba(255,140,80,0.2)' : 'rgba(140,210,255,0.2)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, S.auraRadius, 0, TAU); ctx.stroke();
  }
}

function drawOrbitals() {
  const S = G.S;
  {
    ctx.strokeStyle = 'rgba(191,244,255,0.12)';
    ctx.lineWidth = 1;
    if (S.orbitals > 0) { ctx.beginPath(); ctx.arc(0, 0, S.orbitalRadius, 0, TAU); ctx.stroke(); }
    for (let i = 0; i < S.orbitals; i++) {
      const a = G.orbitCd + (i / S.orbitals) * TAU;
      const x = Math.cos(a) * S.orbitalRadius, y = Math.sin(a) * S.orbitalRadius;
      ctx.save();
      ctx.translate(x, y); ctx.rotate(a + Math.PI / 2);
      ctx.globalCompositeOperation = 'lighter';
      glow(0, 0, 16, '#8ff0ff', 0.5);
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#dff6ff';
      ctx.beginPath();
      ctx.moveTo(0, -13); ctx.lineTo(4.5, 4); ctx.lineTo(0, 11); ctx.lineTo(-4.5, 4);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
}

/* ---------- БАШНЯ ---------- */
function drawTowerShape(T, S, t) {
  const hpFrac = T.maxHp ? T.hp / T.maxHp : 1;
  // платформа
  ctx.save();
  ctx.rotate(Math.PI / 8);
  ctx.fillStyle = '#2c3d5e';
  ctx.strokeStyle = '#7d9cc8';
  ctx.lineWidth = 3.2;
  poly(0, 0, T.r + 13, 8);
  ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#1d2a44';
  ctx.beginPath(); ctx.arc(0, 0, T.r + 4, 0, TAU); ctx.fill();
  // болты
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * TAU + Math.PI / 8;
    ctx.fillStyle = '#4a6288';
    ctx.beginPath(); ctx.arc(Math.cos(a) * (T.r + 9), Math.sin(a) * (T.r + 9), 2.2, 0, TAU); ctx.fill();
  }

  // кольцо прочности
  ctx.lineWidth = 4.5;
  ctx.strokeStyle = 'rgba(255,255,255,0.09)';
  ctx.beginPath(); ctx.arc(0, 0, T.r + 17, 0, TAU); ctx.stroke();
  const col = hpFrac > 0.55 ? '#5ee08a' : hpFrac > 0.25 ? '#ffcc55' : '#ff5566';
  ctx.strokeStyle = col;
  ctx.beginPath(); ctx.arc(0, 0, T.r + 17, -Math.PI / 2, -Math.PI / 2 + TAU * hpFrac); ctx.stroke();
  if (T.shield > 0) {
    ctx.strokeStyle = hexA('#59c8ff', 0.75);
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, T.r + 23, 0, TAU); ctx.stroke();
    ctx.globalCompositeOperation = 'lighter';
    glow(0, 0, T.r + 30, '#59c8ff', 0.25);
    ctx.globalCompositeOperation = 'source-over';
  }

  // турель
  ctx.save();
  ctx.rotate(T.angle);
  const rec = T.recoil ? -T.recoil * 5 : 0;
  const barrels = Math.max(1, Math.min(5, Math.round(S.projectiles || 1)));
  ctx.fillStyle = '#46628f';
  ctx.strokeStyle = '#9cc0ea';
  ctx.lineWidth = 2;
  for (let i = 0; i < barrels; i++) {
    const off = (i - (barrels - 1) / 2) * 8.5;
    ctx.save();
    ctx.translate(rec, off);
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(T.r - 12, -3.6, 30, 7.2, 3) : ctx.rect(T.r - 12, -3.6, 30, 7.2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#c8ecff';
    ctx.fillRect(T.r + 14, -2.2, 4, 4.4);
    ctx.fillStyle = '#46628f';
    ctx.restore();
  }
  // корпус турели
  ctx.fillStyle = '#33496f';
  ctx.strokeStyle = '#8fb4e0';
  poly(0, 0, T.r, 6);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#243350';
  ctx.beginPath(); ctx.arc(0, 0, T.r * 0.6, 0, TAU); ctx.fill();
  ctx.restore();
  // вращающееся энергокольцо платформы
  ctx.strokeStyle = hexA('#8ff0ff', 0.3);
  ctx.lineWidth = 1.6;
  ctx.setLineDash([6, 10]);
  ctx.beginPath(); ctx.arc(0, 0, T.r + 8, t * 0.8, t * 0.8 + TAU); ctx.stroke();
  ctx.setLineDash([]);

  // ядро
  const pulse = 0.75 + Math.sin(t * 3) * 0.12 + (T.pulse || 0) * 0.4;
  ctx.globalCompositeOperation = 'lighter';
  glow(0, 0, T.r * 1.5 * pulse, T.hitFlash > 0 ? '#ff5566' : '#8ff0ff', 0.55);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = T.hitFlash > 0 ? '#ffd0d6' : '#dff6ff';
  ctx.beginPath(); ctx.arc(0, 0, T.r * 0.32 * (1 + (T.pulse || 0) * 0.25), 0, TAU); ctx.fill();
  if (T.hitFlash > 0) {
    ctx.fillStyle = hexA('#ff5566', T.hitFlash * 2);
    ctx.beginPath(); ctx.arc(0, 0, T.r + 6, 0, TAU); ctx.fill();
  }
}

function drawTower() {
  const T = G.tower;
  ctx.save();
  ctx.translate(T.x, T.y);
  drawTowerShape(T, G.S, G.time);
  ctx.restore();
  if (T.pulse > 0) T.pulse = Math.max(0, T.pulse - 0.06);
}

/* ---------- ПОСТРОЙКИ ---------- */
function drawStructs() {
  for (const s of G.structs) {
    ctx.save();
    ctx.translate(s.x, s.y);
    const def = s.def;
    const dmgFrac = s.hp / s.maxHp;
    if (s.key === 'turret') {
      ctx.fillStyle = '#2a3a58'; ctx.strokeStyle = '#5c7ba8'; ctx.lineWidth = 2;
      poly(0, 0, s.r, 4); ctx.fill(); ctx.stroke();
      ctx.save(); ctx.rotate(s.ang || 0);
      ctx.fillStyle = '#3d5578';
      ctx.fillRect(0, -3, s.r + 8, 6);
      ctx.fillStyle = '#ffd23f'; ctx.fillRect(s.r + 5, -2, 3, 4);
      ctx.restore();
      ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(0, 0, 4, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'lighter'; glow(0, 0, 22, '#ffd23f', 0.18); ctx.globalCompositeOperation = 'source-over';
    } else if (s.key === 'mine') {
      const blink = 0.5 + Math.sin(G.time * 6 + s.born) * 0.5;
      ctx.fillStyle = '#3a2a2a'; ctx.strokeStyle = '#8a5a4a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, s.r, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = hexA('#ff5566', 0.4 + blink * 0.6);
      ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, TAU); ctx.fill();
      ctx.strokeStyle = hexA('#ff5566', 0.12);
      ctx.setLineDash([5, 7]);
      ctx.beginPath(); ctx.arc(0, 0, def.trigR, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    } else if (s.key === 'cryo') {
      ctx.fillStyle = 'rgba(120,200,255,0.07)';
      ctx.beginPath(); ctx.arc(0, 0, def.range, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(140,215,255,0.3)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, 0, def.range, 0, TAU); ctx.stroke();
      ctx.fillStyle = '#22405e'; ctx.strokeStyle = '#7fd8ff'; ctx.lineWidth = 2;
      poly(0, 0, s.r, 6); ctx.fill(); ctx.stroke();
      ctx.save(); ctx.rotate(G.time * 0.8);
      ctx.strokeStyle = '#bff4ff'; ctx.lineWidth = 2.2;
      for (let i = 0; i < 3; i++) {
        const a = (i / 3) * Math.PI;
        ctx.beginPath();
        ctx.moveTo(-Math.cos(a) * 9, -Math.sin(a) * 9);
        ctx.lineTo(Math.cos(a) * 9, Math.sin(a) * 9);
        ctx.stroke();
      }
      ctx.restore();
      ctx.globalCompositeOperation = 'lighter'; glow(0, 0, 26, '#7fd8ff', 0.25); ctx.globalCompositeOperation = 'source-over';
    } else if (s.key === 'wall') {
      ctx.fillStyle = '#3a3f4d'; ctx.strokeStyle = '#6b7385'; ctx.lineWidth = 2.5;
      poly(0, 0, s.r, 6); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.13)'; ctx.lineWidth = 1.5;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath(); ctx.moveTo(-s.r * 0.7, i * 7); ctx.lineTo(s.r * 0.7, i * 7); ctx.stroke();
      }
      ctx.beginPath(); ctx.moveTo(0, -s.r * 0.8); ctx.lineTo(0, s.r * 0.8); ctx.stroke();
    } else if (s.key === 'farm') {
      ctx.fillStyle = '#3d3524'; ctx.strokeStyle = '#c9a44a'; ctx.lineWidth = 2;
      poly(0, 0, s.r, 4); ctx.fill(); ctx.stroke();
      ctx.globalCompositeOperation = 'lighter';
      glow(0, 0, 24, '#ffd23f', 0.22 + Math.sin(G.time * 3 + s.born) * 0.08);
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#ffd23f';
      for (let i = 0; i < 3; i++) {
        const a = (i / 3) * TAU + G.time * 0.6;
        ctx.beginPath(); ctx.arc(Math.cos(a) * 7, Math.sin(a) * 7, 3, 0, TAU); ctx.fill();
      }
    }
    // полоска прочности
    if (dmgFrac < 0.999) {
      const w = s.r * 2;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(-w / 2, -s.r - 11, w, 4);
      ctx.fillStyle = dmgFrac > 0.5 ? '#5ee08a' : dmgFrac > 0.25 ? '#ffcc55' : '#ff5566';
      ctx.fillRect(-w / 2, -s.r - 11, w * clamp(dmgFrac, 0, 1), 4);
    }
    if (s.flash > 0) {
      ctx.fillStyle = hexA('#ffffff', s.flash * 2.5);
      ctx.beginPath(); ctx.arc(0, 0, s.r + 3, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}

/* ---------- ВРАГИ ---------- */
function poly(x, y, r, n, rot = 0) {
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rot + (i / n) * TAU;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function drawEnemies() {
  for (const e of G.enemies) {
    if (e.dead) continue;
    const spawnK = e.spawnT > 0 ? clamp(1 - e.spawnT / (e.boss ? 1 : 0.45), 0.3, 1) : 1;
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.scale(spawnK, spawnK);
    drawEnemyShape(e);
    ctx.restore();

    // полоска HP
    if (e.hp < e.maxHp && !e.boss) {
      const w = Math.max(18, e.r * 2.1);
      const y = -e.r - 9;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(e.x - w / 2, y, w, 3.6);
      ctx.fillStyle = e.hp / e.maxHp > 0.5 ? '#7bd948' : e.hp / e.maxHp > 0.22 ? '#ffcc55' : '#ff5566';
      ctx.fillRect(e.x - w / 2, y, w * clamp(e.hp / e.maxHp, 0, 1), 3.6);
      if (e.shieldMax > 0 && e.shieldHp > 0) {
        ctx.fillStyle = 'rgba(255,214,130,0.85)';
        ctx.fillRect(e.x - w / 2, y - 3.4, w * clamp(e.shieldHp / e.shieldMax, 0, 1), 2.6);
      }
    }
    if (G.focus === e) {
      const pu = 0.6 + Math.sin(G.time * 8) * 0.4;
      ctx.strokeStyle = hexA('#ff5566', 0.5 + pu * 0.5);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 7, 0, TAU); ctx.stroke();
      ctx.beginPath();
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * TAU + Math.PI / 4;
        ctx.moveTo(e.x + Math.cos(a) * (e.r + 3), e.y + Math.sin(a) * (e.r + 3));
        ctx.lineTo(e.x + Math.cos(a) * (e.r + 12), e.y + Math.sin(a) * (e.r + 12));
      }
      ctx.stroke();
    }
    if (e.burnT > 0) {
      ctx.globalCompositeOperation = 'lighter';
      glow(e.x, e.y, e.r * 2, '#ff7a2f', 0.3);
      ctx.globalCompositeOperation = 'source-over';
    }
    if (e.slowT > 0 || e.fieldSlow > 0) {
      ctx.strokeStyle = hexA('#8fd8ff', 0.5);
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 3, 0, TAU); ctx.stroke();
    }
  }
}

function drawEnemyShape(e) {
  const d = e.def, t = G.time;
  const c = d.color;
  const body = e.flash > 0 ? '#ffffff' : c;
  ctx.rotate(e.ang + Math.PI / 2);
  ctx.globalCompositeOperation = 'lighter';
  glow(0, 0, e.r * (e.boss ? 2.6 : 1.9), c, e.boss ? 0.4 : 0.22);
  ctx.globalCompositeOperation = 'source-over';
  ctx.lineWidth = 2;
  ctx.strokeStyle = hexA('#000000', 0.45);

  switch (d.shape) {
    case 'blob': {
      ctx.fillStyle = body;
      ctx.beginPath();
      for (let i = 0; i <= 14; i++) {
        const a = (i / 14) * TAU;
        const rr = e.r * (1 + Math.sin(a * 3 + t * 6 + e.wob) * 0.09);
        const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      eyes(e.r * 0.42, e.r * 0.3);
      break;
    }
    case 'dart': {
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.moveTo(0, -e.r * 1.5); ctx.lineTo(e.r * 0.9, e.r); ctx.lineTo(0, e.r * 0.45); ctx.lineTo(-e.r * 0.9, e.r);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = hexA('#000', 0.35);
      ctx.beginPath(); ctx.arc(0, -e.r * 0.2, e.r * 0.32, 0, TAU); ctx.fill();
      break;
    }
    case 'hex': {
      ctx.fillStyle = body;
      poly(0, 0, e.r, 6); ctx.fill(); ctx.stroke();
      ctx.fillStyle = hexA('#ffffff', 0.14);
      poly(0, -e.r * 0.15, e.r * 0.62, 6); ctx.fill();
      ctx.strokeStyle = hexA('#000', 0.3);
      ctx.beginPath(); ctx.moveTo(-e.r * 0.6, e.r * 0.3); ctx.lineTo(e.r * 0.6, e.r * 0.3); ctx.stroke();
      eyes(e.r * 0.4, e.r * 0.1, '#ff5566');
      break;
    }
    case 'spit': {
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.arc(0, 0, e.r, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = hexA('#2a0f3d', 0.8);
      ctx.beginPath(); ctx.ellipse(0, -e.r * 0.55, e.r * 0.45, e.r * 0.3, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffe066';
      ctx.beginPath(); ctx.arc(0, e.r * 0.2, e.r * 0.35, 0, TAU); ctx.fill();
      ctx.fillStyle = '#1a0a22';
      ctx.beginPath(); ctx.arc(0, e.r * 0.2, e.r * 0.16, 0, TAU); ctx.fill();
      break;
    }
    case 'bomb': {
      const blink = 0.5 + Math.sin(t * 14 + e.wob) * 0.5;
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.arc(0, 0, e.r, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#c9a44a'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, -e.r * 0.9); ctx.quadraticCurveTo(e.r * 0.5, -e.r * 1.5, e.r * 0.2, -e.r * 1.8); ctx.stroke();
      ctx.globalCompositeOperation = 'lighter';
      glow(e.r * 0.2, -e.r * 1.85, 10 + blink * 6, '#ffcc55', 0.8);
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = hexA('#ff5566', 0.35 + blink * 0.5);
      ctx.beginPath(); ctx.arc(0, 0, e.r * 0.55, 0, TAU); ctx.fill();
      break;
    }
    case 'square': {
      ctx.fillStyle = body;
      poly(0, 0, e.r * 1.15, 4, Math.PI / 4 + Math.sin(t * 2 + e.wob) * 0.2);
      ctx.fill(); ctx.stroke();
      ctx.strokeStyle = hexA('#ffffff', 0.35); ctx.lineWidth = 1.6;
      poly(0, 0, e.r * 0.6, 4, Math.PI / 4); ctx.stroke();
      break;
    }
    case 'fly': {
      const flap = Math.sin(t * 22 + e.wob) * 0.5;
      ctx.fillStyle = hexA(c, 0.45);
      ctx.save(); ctx.rotate(flap);
      ctx.beginPath(); ctx.ellipse(-e.r * 0.9, 0, e.r * 1.1, e.r * 0.42, -0.4, 0, TAU); ctx.fill();
      ctx.restore();
      ctx.save(); ctx.rotate(-flap);
      ctx.beginPath(); ctx.ellipse(e.r * 0.9, 0, e.r * 1.1, e.r * 0.42, 0.4, 0, TAU); ctx.fill();
      ctx.restore();
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.moveTo(0, -e.r * 1.2); ctx.lineTo(e.r * 0.55, e.r * 0.7); ctx.lineTo(-e.r * 0.55, e.r * 0.7);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#dff6ff';
      ctx.beginPath(); ctx.arc(0, -e.r * 0.35, e.r * 0.22, 0, TAU); ctx.fill();
      break;
    }
    case 'shield': {
      ctx.fillStyle = body;
      poly(0, 0, e.r, 5); ctx.fill(); ctx.stroke();
      eyes(e.r * 0.4, e.r * 0.15);
      if (e.shieldHp > 0) {
        const f = e.shieldHp / e.shieldMax;
        ctx.strokeStyle = hexA('#ffd76b', 0.35 + f * 0.55);
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(0, 0, e.r + 6, -Math.PI / 2 - 1.1 * f, -Math.PI / 2 + 1.1 * f); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, e.r + 6, Math.PI / 2 - 1.1 * f, Math.PI / 2 + 1.1 * f); ctx.stroke();
      }
      break;
    }
    case 'diamond': {
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.moveTo(0, -e.r * 1.4); ctx.lineTo(e.r * 0.85, 0); ctx.lineTo(0, e.r * 1.4); ctx.lineTo(-e.r * 0.85, 0);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.globalCompositeOperation = 'lighter';
      glow(0, 0, e.r * 1.4, '#ff5ea8', 0.3 + Math.sin(t * 4) * 0.15);
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#ffe0f0';
      ctx.beginPath(); ctx.arc(0, 0, e.r * 0.28, 0, TAU); ctx.fill();
      break;
    }
    case 'healer': {
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.arc(0, 0, e.r, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#eafff0';
      ctx.fillRect(-e.r * 0.22, -e.r * 0.6, e.r * 0.44, e.r * 1.2);
      ctx.fillRect(-e.r * 0.6, -e.r * 0.22, e.r * 1.2, e.r * 0.44);
      ctx.globalCompositeOperation = 'lighter';
      glow(0, 0, e.r * 2.4, '#9dff8a', 0.18 + Math.sin(t * 3 + e.wob) * 0.1);
      ctx.globalCompositeOperation = 'source-over';
      break;
    }
    case 'boss1': { // Крушитель
      ctx.fillStyle = body;
      poly(0, 0, e.r, 6, t * 0.2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = hexA('#ffffff', 0.1);
      poly(0, 0, e.r * 0.7, 6, t * 0.2); ctx.fill();
      ctx.fillStyle = '#8a1f2b';
      for (let i = 0; i < 6; i++) {
        const a = t * 0.2 + (i / 6) * TAU;
        ctx.save(); ctx.rotate(a);
        ctx.beginPath();
        ctx.moveTo(e.r * 0.85, -7); ctx.lineTo(e.r * 1.3, 0); ctx.lineTo(e.r * 0.85, 7);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath(); ctx.arc(-e.r * 0.25, -e.r * 0.15, 6, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(e.r * 0.25, -e.r * 0.15, 6, 0, TAU); ctx.fill();
      ctx.fillStyle = '#2a0a0f';
      ctx.beginPath(); ctx.arc(-e.r * 0.25, -e.r * 0.15, 2.6, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(e.r * 0.25, -e.r * 0.15, 2.6, 0, TAU); ctx.fill();
      if (e.chargeT > 0) {
        ctx.globalCompositeOperation = 'lighter';
        glow(0, 0, e.r * 2.2, '#ff5566', 0.45);
        ctx.globalCompositeOperation = 'source-over';
      }
      break;
    }
    case 'boss2': { // Матка
      ctx.fillStyle = body;
      ctx.beginPath();
      for (let i = 0; i <= 20; i++) {
        const a = (i / 20) * TAU;
        const rr = e.r * (1 + Math.sin(a * 4 + t * 3) * 0.12);
        const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = hexA('#ffe0ff', 0.35);
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * TAU + t * 0.4;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * e.r * 0.5, Math.sin(a) * e.r * 0.5, 7 + Math.sin(t * 3 + i) * 2, 0, TAU);
        ctx.fill();
      }
      ctx.fillStyle = '#2a0a2f';
      ctx.beginPath(); ctx.ellipse(0, -e.r * 0.1, e.r * 0.3, e.r * 0.2, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ff5ea8';
      ctx.beginPath(); ctx.arc(0, -e.r * 0.1, e.r * 0.12, 0, TAU); ctx.fill();
      break;
    }
    case 'boss3': { // Повелитель бури
      const flap = Math.sin(t * 12) * 0.35;
      ctx.fillStyle = hexA(c, 0.5);
      ctx.save(); ctx.rotate(flap);
      ctx.beginPath(); ctx.ellipse(-e.r, 0, e.r * 1.5, e.r * 0.5, -0.35, 0, TAU); ctx.fill();
      ctx.restore();
      ctx.save(); ctx.rotate(-flap);
      ctx.beginPath(); ctx.ellipse(e.r, 0, e.r * 1.5, e.r * 0.5, 0.35, 0, TAU); ctx.fill();
      ctx.restore();
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.moveTo(0, -e.r * 1.3); ctx.lineTo(e.r * 0.8, e.r * 0.8); ctx.lineTo(0, e.r * 0.35); ctx.lineTo(-e.r * 0.8, e.r * 0.8);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.globalCompositeOperation = 'lighter';
      glow(0, 0, e.r * 1.8, '#9fe8ff', 0.35 + Math.sin(t * 8) * 0.15);
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = '#dff6ff'; ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const a = t * 5 + i * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * e.r * 0.4, Math.sin(a) * e.r * 0.4);
        ctx.lineTo(Math.cos(a + 0.6) * e.r * 1.1, Math.sin(a + 0.6) * e.r * 1.1);
        ctx.stroke();
      }
      break;
    }
  }

  if (e.flash > 0) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = hexA('#ffffff', clamp(e.flash * 3, 0, 0.7));
    ctx.beginPath(); ctx.arc(0, 0, e.r * 1.05, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
}

function eyes(spread, yOff, color = '#0d1220') {
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(-spread * 0.6, -yOff, 3.4, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(spread * 0.6, -yOff, 3.4, 0, TAU); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(-spread * 0.6, -yOff - 0.8, 1.7, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(spread * 0.6, -yOff - 0.8, 1.7, 0, TAU); ctx.fill();
}

/* ---------- СНАРЯДЫ ---------- */
function drawBullets() {
  ctx.globalCompositeOperation = 'lighter';
  for (const b of G.bullets) {
    const tx = b.x - b.vx * 0.028, ty = b.y - b.vy * 0.028;
    const col = b.color;
    glow(b.x, b.y, b.r * (b.crit ? 3.4 : 2.6), col, 0.6);
    ctx.strokeStyle = hexA(col, 0.55);
    ctx.lineWidth = b.r * 1.1;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.55, 0, TAU); ctx.fill();
    if (b.kind === 'missile') {
      ctx.save();
      ctx.translate(b.x, b.y); ctx.rotate(b.ang);
      ctx.fillStyle = '#ffd0a0';
      ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(-4, 3.4); ctx.lineTo(-4, -3.4); ctx.closePath(); ctx.fill();
      ctx.restore();
      glow(b.x - b.vx * 0.03, b.y - b.vy * 0.03, 10, '#ff7a2f', 0.5);
    }
  }
  for (const b of G.eBullets) {
    glow(b.x, b.y, b.r * 2.6, b.color, 0.55);
    ctx.fillStyle = hexA(b.color, 0.9);
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.75, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.3, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ---------- ПИКАПЫ ---------- */
function drawPickups() {
  ctx.globalCompositeOperation = 'lighter';
  for (const p of G.pickups) {
    if (p.kind === 'coin') {
      const sq = Math.abs(Math.cos(p.spin));
      glow(p.x, p.y, 12, '#ffd23f', 0.45);
      ctx.fillStyle = '#ffe066';
      ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r * (0.35 + sq * 0.65), p.r, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#c9922a';
      ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r * 0.4 * (0.35 + sq * 0.65), p.r * 0.45, 0, 0, TAU); ctx.fill();
    } else {
      glow(p.x, p.y, 18, '#7bd948', 0.5);
      ctx.fillStyle = '#eafff0';
      ctx.fillRect(p.x - 3, p.y - 8, 6, 16);
      ctx.fillRect(p.x - 8, p.y - 3, 16, 6);
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ---------- ЧАСТИЦЫ ---------- */
function drawParticles() {
  ctx.globalCompositeOperation = 'lighter';
  for (const p of G.parts) {
    const k = clamp(p.life / p.max, 0, 1);
    if (p.kind === 'spark') {
      ctx.fillStyle = hexA(p.color, k);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.4 + k * 0.6), 0, TAU); ctx.fill();
    } else if (p.kind === 'smoke') {
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = hexA(p.color, k * 0.22);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'lighter';
    } else if (p.kind === 'ring') {
      ctx.strokeStyle = hexA(p.color, k * 0.75);
      ctx.lineWidth = 2 + k * 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1.25 - k * 0.25), 0, TAU); ctx.stroke();
    } else if (p.kind === 'strikeWarn') {
      ctx.globalCompositeOperation = 'source-over';
      const pulse = 0.5 + Math.sin(G.time * 22) * 0.5;
      ctx.strokeStyle = hexA('#ff5566', 0.5 + pulse * 0.5);
      ctx.lineWidth = 3;
      ctx.setLineDash([10, 8]);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 - k * 0.15), 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = hexA('#ff5566', 0.12 + pulse * 0.1);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
      ctx.strokeStyle = hexA('#ff5566', 0.8);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(p.x - p.r * 1.3, p.y); ctx.lineTo(p.x + p.r * 1.3, p.y);
      ctx.moveTo(p.x, p.y - p.r * 1.3); ctx.lineTo(p.x, p.y + p.r * 1.3);
      ctx.stroke();
      ctx.globalCompositeOperation = 'lighter';
    } else if (p.kind === 'beam') {
      glow(p.x, p.y, p.r * (0.6 + (1 - k) * 0.6), '#ffe6b0', k * 0.9);
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawArcs() {
  ctx.globalCompositeOperation = 'lighter';
  for (const a of G.arcs) {
    const k = a.life / a.max;
    ctx.strokeStyle = hexA('#9fe8ff', k);
    ctx.lineWidth = 2 + k * 2;
    ctx.beginPath();
    const segs = 5;
    for (let i = 0; i <= segs; i++) {
      const t = i / segs;
      const x = lerp(a.x1, a.x2, t) + (i && i < segs ? rand(-9, 9) : 0);
      const y = lerp(a.y1, a.y2, t) + (i && i < segs ? rand(-9, 9) : 0);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawTexts() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const t of G.texts) {
    const k = clamp(t.life / t.max, 0, 1);
    ctx.globalAlpha = k;
    ctx.font = `bold ${t.size}px system-ui, sans-serif`;
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

/* ---------- ПРИЗРАК ПОСТРОЙКИ / ПРИЦЕЛ ---------- */
function drawGhost() {
  if (!G.placing) return;
  const def = STRUCTS[G.placing];
  const x = G.mouse.wx, y = G.mouse.wy;
  const ok = canPlaceAt(x, y);
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = ok ? hexA(def.id === 'mine' ? '#ff8866' : '#8ff0ff', 0.3) : 'rgba(255,80,90,0.3)';
  ctx.strokeStyle = ok ? '#dff6ff' : '#ff5566';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, def.r, 0, TAU); ctx.fill(); ctx.stroke();
  if (def.range) {
    ctx.strokeStyle = hexA('#8ff0ff', 0.4);
    ctx.setLineDash([7, 7]);
    ctx.beginPath(); ctx.arc(0, 0, def.range, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  }
  if (def.trigR) {
    ctx.strokeStyle = hexA('#ff8866', 0.4);
    ctx.setLineDash([6, 8]);
    ctx.beginPath(); ctx.arc(0, 0, def.trigR + 20, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawStrikeAim() {
  if (!G.strike.aiming) return;
  const r = G.S.strikeRadius;
  const x = G.strike.x, y = G.strike.y;
  ctx.save();
  ctx.strokeStyle = hexA('#ff5566', 0.9);
  ctx.lineWidth = 2;
  ctx.setLineDash([12, 8]);
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(255,85,102,0.1)';
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x - r - 14, y); ctx.lineTo(x - r + 6, y);
  ctx.moveTo(x + r - 6, y); ctx.lineTo(x + r + 14, y);
  ctx.moveTo(x, y - r - 14); ctx.lineTo(x, y - r + 6);
  ctx.moveTo(x, y + r - 6); ctx.lineTo(x, y + r + 14);
  ctx.stroke();
  ctx.fillStyle = '#ff8899';
  ctx.font = 'bold 13px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('УДАР — клик / ESC для отмены', x, y - r - 24);
  ctx.textAlign = 'left';
  ctx.restore();
}

/* ---------- ЭКРАННЫЕ ЭФФЕКТЫ ---------- */
function drawOverlay() {
  if (G.flash > 0) {
    ctx.fillStyle = hexA(G.flashColor || '#fff', G.flash * 0.5);
    ctx.fillRect(0, 0, W, H);
  }
  const hpFrac = G.tower.maxHp ? G.tower.hp / G.tower.maxHp : 1;
  if (hpFrac < 0.35 && G.state !== 'dead') {
    const a = (0.35 - hpFrac) / 0.35;
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.62);
    g.addColorStop(0, 'rgba(255,40,60,0)');
    g.addColorStop(1, `rgba(255,40,60,${0.35 * a * (0.7 + Math.sin(G.time * 5) * 0.3)})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
}


/* ===== ui.js ===== */
/* =========================================================
   UI: HUD, лавка забега, мета-магазин, экраны
   ========================================================= */
'use strict';

const $ = (s) => document.querySelector(s);
const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html !== undefined) n.innerHTML = html;
  return n;
};

const UI = {
  modalOpen: false,
  _shopOpen: false,
  _bossLast: -1,
  _bossShown: false,
  _toasts: [],

  init() {
    this.cache();
    this.bind();
    this.hudAll();
    this.showMenu();
  },

  cache() {
    this.cv = $('#cv');
    this.hpFill = $('#hpFill'); this.hpText = $('#hpText'); this.shieldFill = $('#shieldFill');
    this.coinText = $('#coinText'); this.waveText = $('#waveText'); this.killText = $('#killText');
    this.waveProgFill = $('#waveProgFill');
    this.buildWrap = $('#buildWrap'); this.buildText = $('#buildText'); this.buildFill = $('#buildFill');
    this.btnStart = $('#btnStart'); this.btnTarget = $('#btnTarget'); this.btnStrike = $('#btnStrike');
    this.strikeCd = $('#strikeCd'); this.strikeKey = $('#strikeKey');
    this.invBar = $('#invBar');
    this.shop = $('#shop'); this.shelf = $('#shelf'); this.rerollText = $('#rerollText');
    this.structList = $('#structList'); this.btnRepair = $('#btnRepair');
    this.leftCol = $('#leftCol');
    this.bossBar = $('#bossBar'); this.bossName = $('#bossName'); this.bossFill = $('#bossFill');
    this.bannerEl = $('#banner'); this.bannerSubEl = $('#bannerSub'); this.bannerWrap = $('#bannerWrap');
    this.toasts = $('#toasts');
    this.overlay = $('#overlay'); this.screen = $('#screen');
    this.hud = $('#hud');
    this.statsPanel = $('#statsPanel'); this.statsBody = $('#statsBody');
    this.enemyPanel = $('#enemyPanel'); this.enemyBody = $('#enemyBody'); this.enemyTitle = $('#enemyTitle');
    this._statsMin = false;   // в портретной сетке телефона характеристики видны в своём ряду
  },

  bind() {
    $('#btnPause').onclick = () => togglePause();
    $('#btnSound').onclick = (e) => {
      SAVE.sound = !SAVE.sound; markSave();
      e.currentTarget.classList.toggle('off', !SAVE.sound);
      if (SAVE.sound) { Sfx.resume(); Sfx.buy(); }
    };
    $('#btnHelp').onclick = () => this.showHelp();
    const bStPop = $('#btnStatsPop');
    if (bStPop) bStPop.onclick = () => this.showStatsPop();
    const bWvPop = $('#btnWavePop');
    if (bWvPop) bWvPop.onclick = () => this.showWavePop();
    this.btnStart.onclick = () => startWave();
    this.btnTarget.onclick = () => cycleTarget(1);
    this.btnStrike.onclick = () => {
      if (!G || G.state === 'dead') return;
      if (G.strike.cd > 0) { Sfx.deny(); this.toast('Орбитальный удар перезаряжается'); return; }
      G.strike.aiming = !G.strike.aiming;
      this.hudAbility();
      if (G.strike.aiming) this.toast('Выберите точку удара на арене');
    };
    $('#btnReroll').onclick = () => rerollShelf();
    this.btnRepair.onclick = () => buyRepair();
    const bSt = $('#btnStats');
    if (bSt) bSt.onclick = () => { this._statsMin = !this._statsMin; this._applyStatsMin(); };
    const bSp = $('#btnSpeed');
    if (bSp) bSp.onclick = () => cycleSpeed();
    this._applyStatsMin();
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && this.modalOpen && !$('#screen').dataset.locked) {
        e.stopImmediatePropagation();   // игра не ставит паузу «поверх» выхода из модалки
        if (this._onEsc) this._onEsc(); else this.closeModal();
      }
    });
  },

  /* ---------------- HUD ---------------- */
  hudAll() { this.hudHp(); this.hudCoins(); this.hudWave(); this.hudTarget(); this.hudAbility(); this.renderInv(); this.hudBuild(); this.renderStats(); this.renderEnemies(); this.hudSpeed(); },

  /* текущие деньги: в забеге — кошелёк забега, вне — мета-кошелёк */
  wallet() { return G ? (G.purse !== undefined ? G.purse : 0) : SAVE.coins; },

  hudHp() {
    if (!G) return;
    const T = G.tower;
    const f = clamp(T.hp / T.maxHp, 0, 1);
    this.hpFill.style.width = (f * 100) + '%';
    this.hpFill.className = 'fill ' + (f > 0.55 ? 'ok' : f > 0.25 ? 'warn' : 'bad');
    this.hpText.textContent = Math.ceil(T.hp) + ' / ' + T.maxHp;
    const sf = T.maxHp ? clamp((T.shield || 0) / T.maxHp, 0, 1) : 0;
    this.shieldFill.style.width = (sf * 100) + '%';
    this.shieldFill.style.display = T.shield > 0 ? 'block' : 'none';
  },

  hudCoins() {
    const val = fmt(this.wallet());
    if (!G) { const c = $('#menuCoins'); if (c) c.textContent = val; return; }
    this.coinText.textContent = val;
    document.querySelectorAll('.shop-coins').forEach(n => n.textContent = val);
    if (this._shopOpen) this.paintPrices();
  },

  hudWave() {
    if (!G) return;
    this.waveText.textContent = 'Волна ' + (G.wave || '—');
    const total = G.waveCount || 0;
    const done = G.waveKilled || 0;
    this.killText.textContent = total ? (done + ' / ' + total) : '';
    if (G.state === 'wave' && total) {   // таймер лимита волны прямо в чипе
      const left = Math.max(0, WAVE_TIME_LIMIT - (G.waveT || 0));
      this.killText.textContent = done + ' / ' + total + ' · ' + Math.ceil(left) + 'с';
    }
    const f = total ? clamp(done / total, 0, 1) : 0;
    this.waveProgFill.style.width = (f * 100) + '%';
  },

  hudBuild() {
    if (!G) return;
    const inBuild = G.state === 'build';
    this.buildWrap.classList.toggle('hidden', !inBuild);
    this.btnStart.classList.toggle('hidden', !inBuild);
    if (inBuild) {
      const f = clamp(G.buildT / BUILD_TIME, 0, 1);
      this.buildFill.style.width = (f * 100) + '%';
      const bonus = Math.floor(G.buildT / 3);
      this.buildText.innerHTML = 'Подготовка: <b>' + Math.ceil(G.buildT) + 'с</b>' + (bonus > 0 ? ' <span class="bonus">старт сейчас +' + bonus + '</span>' : '');
    }
  },

  hudTarget() {
    if (!G) return;
    const m = TARGET_MODES[G.targetMode];
    this.btnTarget.innerHTML = '<span class="ico">' + m.icon + '</span><span>' + m.name + '</span>';
  },

  hudAbility() {
    if (!G) return;
    const cd = G.strike.cd;
    const ready = cd <= 0;
    if (this._strikeReady !== ready) {
      this._strikeReady = ready;
      this.btnStrike.classList.toggle('ready', ready);
      this.btnStrike.classList.toggle('cooling', !ready);   // цифра вместо надписи
    }
    const aiming = !!G.strike.aiming;
    if (this._strikeAim !== aiming) {
      this._strikeAim = aiming;
      this.btnStrike.classList.toggle('aiming', aiming);
    }
    if (cd > 0) {
      const f = clamp(1 - cd / G.S.strikeCd, 0, 1);
      this.strikeCd.style.background = `conic-gradient(rgba(255,210,63,.35) ${f * 360}deg, rgba(255,255,255,.06) 0deg)`;
      const key = String(Math.ceil(cd));
      if (this._strikeKey !== key) { this._strikeKey = key; this.strikeKey.textContent = key; }
    } else if (this._strikeKey !== '') {
      this._strikeKey = '';
      this.strikeCd.style.background = 'none';
      this.strikeKey.textContent = '';
    }
  },

  bossTick() {
    if (!G) return;
    const b = G.bossAlive;
    const show = !!(b && !b.dead && b.hp > 0);
    if (!show) {
      // прячем полоску всегда, когда босса больше нет (в т.ч. после «пустой» полоски)
      if (this._bossShown) { this.bossBar.classList.add('hidden'); this._bossShown = false; }
      this._bossLast = -1;
      return;
    }
    if (!this._bossShown) { this.bossBar.classList.remove('hidden'); this._bossShown = true; }
    this.bossName.textContent = b.def.name;
    const f = Math.round(clamp(b.hp / b.maxHp, 0, 1) * 200);
    if (f !== this._bossLast) { this.bossFill.style.width = (f / 2) + '%'; this._bossLast = f; }
  },

  /* ---------------- ЛАВКА ЗАБЕГА ---------------- */
  /* телефон в ландшафте: лавка справа (см. media-query в style.css), а не снизу */
  _isPhoneLandscape() {
    return window.innerWidth < 980 && window.innerHeight < 560 &&
      window.innerWidth > window.innerHeight;
  },
  panelWidth() {
    if (!this._shopOpen) return 0;
    if (this._isPhoneLandscape()) return Math.min(392, window.innerWidth * 0.46);
    return window.innerWidth >= 980 ? Math.min(400, window.innerWidth * 0.34) : 0;
  },
  bottomPad() {
    if (!this._shopOpen) return 0;
    if (this._isPhoneLandscape()) return 0;
    return window.innerWidth < 980 ? Math.min(window.innerHeight * 0.40, 520) : 0;
  },

  openShop() {
    this._shopOpen = true;
    this.shop.classList.remove('hidden');
    this.renderShop();
    resize();
  },
  closeShop() {
    this._shopOpen = false;
    this.shop.classList.add('hidden');
    resize();
  },

  renderShop() {
    if (!G) return;
    // сохраняем позицию прокрутки лавки, чтобы покупка не сбрасывала список наверх
    const sc = this.shop ? this.shop.querySelector('.shop-scroll') : null;
    const sy = sc ? sc.scrollTop : 0;
    const shY = this.shelf ? this.shelf.scrollTop : 0;
    const stY = this.structList ? this.structList.scrollTop : 0;
    this.renderShelf();
    this.renderStructs();
    this.rerollText.textContent = 'Обновлений: ' + G.rerollsLeft;
    $('#btnReroll').disabled = G.rerollsLeft <= 0 || (G.state !== 'build' && G.state !== 'wave');
    this.hudBuild();
    this.renderStats();
    if (sc) sc.scrollTop = sy;
    if (this.shelf) this.shelf.scrollTop = shY;
    if (this.structList) this.structList.scrollTop = stY;
  },

  /* Свернуть/развернуть лавку больше не нужно: авто-сворачивание убрано,
     кнопки у заголовка нет, лавка видна и в подготовке, и в бою. */
  _applyStatsMin() {
    if (!this.statsPanel) return;
    this.statsPanel.classList.toggle('min', !!this._statsMin);
    const b = $('#btnStats');
    if (b) b.textContent = this._statsMin ? '▸' : '▾';
  },

  /* ---------------- ПАНЕЛЬ ХАРАКТЕРИСТИК БАШНИ (меню + забег) ---------------- */
  statsHtml() {
    const S = G ? G.S : computeStats({});
    const r = (k, v) => '<div class="st-row"><span>' + k + '</span><b>' + v + '</b></div>';
    const n1 = (x) => Math.round(x * 10) / 10;
    const dps = Math.round(S.dmg * S.fireRate * S.projectiles * (1 + S.crit * (S.critMult - 1)));
    let base = '';
    base += r('❤️ Прочность', G ? Math.ceil(G.tower.hp) + ' / ' + S.maxHp : S.maxHp);
    if (S.shield > 0) base += r('🔋 Щит', S.shield);
    base += r('🧿 Снижение урона', '-' + Math.round((S.dmgReduce || 0) * 100) + '%');
    base += r('🛡️ Броня', '-' + n1(S.armor) + ' за удар');
    base += r('💢 Урон', n1(S.dmg));
    base += r('⚙️ Темп', (Math.round(S.fireRate * 100) / 100) + '/с');
    base += r('🔱 Снарядов', S.projectiles);
    base += r('📈 DPS', '~' + dps);
    base += r('🎯 Крит', Math.round(S.crit * 100) + '% ×' + (Math.round(S.critMult * 100) / 100));
    if (S.pierce > 0) base += r('🏹 Пробитие', S.pierce);
    base += r('🔭 Дальность', Math.round(S.range));
    const spec = [];
    if (S.orbitals > 0) spec.push(r('🗡️ Клинки', S.orbitals + ' × ' + Math.round(S.orbitalDmg)));
    if (S.missiles > 0) spec.push(r('🚀 Ракеты', S.missiles + ' × ' + Math.round(S.missileDmg)));
    if (S.shockCd > 0) spec.push(r('📡 Импульс', Math.round(S.shockDmg) + ' / ' + n1(S.shockCd) + 'с'));
    if (S.slowAura > 0) spec.push(r('🌬️ Поле стужи', '-' + Math.round(S.slowAura * 100) + '%'));
    if (S.burnAura > 0) spec.push(r('🌋 Выжигание', Math.round(S.burnAura) + '/с'));
    spec.push(r('☄️ Удар', Math.round(S.strikeDmg) + ' / ' + n1(S.strikeCd) + 'с'));
    if (S.lifesteal > 0) spec.push(r('🩸 Вампиризм', n1(S.lifesteal) + ' HP/уб.'));
    if (S.revives > 0) spec.push(r('🧬 Реанимации', S.revives));
    if (S.cascade > 0) spec.push(r('💣 Каскад', Math.round(S.cascadeDmg) + ' урона, r' + Math.round(S.cascade)));
    if (S.fury > 0) spec.push(r('🔥 Ярость', '+' + Math.round(S.fury * 100) + '% при HP<50%'));
    if (S.regen > 0) spec.push(r('💚 Реген', (Math.round(S.regen * 100) / 100) + ' HP/с'));
    const eco = [];
    eco.push(r('💰 Монеты', '+' + Math.round((S.goldMult - 1) * 100) + '%'));
    eco.push(r('🧲 Магнит', Math.round(S.magnet)));
    if (S.priceMult < 1) eco.push(r('🏷️ Цены', '-' + Math.round((1 - S.priceMult) * 100) + '%'));
    return '<div class="st-sec">ОСНОВА</div>' + base +
      '<div class="st-sec">СПЕЦСИСТЕМЫ</div>' + spec.join('') +
      '<div class="st-sec">ЭКОНОМИКА</div>' + eco.join('');
  },
  renderStats() {
    if (!this.statsBody) return;
    this.statsBody.innerHTML = this.statsHtml();
  },

  renderShelf() {
    const S = G.S;
    this.shelf.innerHTML = '';
    G.shelf.forEach((slot, i) => {
      const def = SHOP_BY_ID[slot.id];
      if (!def) return;
      const lv = G.levels[def.id] || 0;
      const price = shopCost(def, lv, Math.max(1, G.wave), S.priceMult);
      const r = RARITY[def.rarity];
      const maxed = lv >= def.max;
      const card = el('div', 'card r-' + def.rarity + (maxed ? ' maxed' : '') + (this.wallet() < price ? ' poor' : ''));
      card.dataset.price = price;
      card.dataset.i = i;
      card.innerHTML =
        '<div class="c-key">' + (i + 1) + '</div>' +
        '<div class="c-ico">' + def.icon + '</div>' +
        '<div class="c-body">' +
        '<div class="c-name">' + def.name + (def.max < 90 ? ' <span class="c-lv">' + lv + '/' + def.max + '</span>' : '') + '</div>' +
        '<div class="c-desc">' + (def.d ? def.d(lv + (def.kind === 'repair' ? 0 : 1)) : '') + '</div>' +
        '<div class="c-rar" style="color:' + r.color + '">' + r.name + '</div>' +
        '</div>' +
        '<div class="c-price">' + (maxed ? 'МАКС' : '<span class="coin silver">◉</span> ' + fmt(price)) + '</div>';
      if (!maxed) card.onclick = () => buyShelf(i);
      this.shelf.appendChild(card);
    });
    if (!G.shelf.length) this.shelf.innerHTML = '<div class="empty">Ассортимент пуст — обновите (R)</div>';
  },

  paintPrices() {
    const w = this.wallet();
    const cards = this.shelf.children;
    for (let i = 0; i < cards.length; i++) {
      const p = parseInt(cards[i].dataset.price || '0', 10);
      cards[i].classList.toggle('poor', w < p);
    }
    const sb = this.structList.children;
    for (let i = 0; i < sb.length; i++) {
      const p = parseInt(sb[i].dataset.price || '0', 10);
      sb[i].classList.toggle('poor', w < p);
    }
  },

  renderStructs() {
    const S = G.S;
    this.structList.innerHTML = '';
    for (const key of ['turret', 'mine', 'cryo', 'wall', 'farm']) {
      const def = STRUCTS[key];
      const price = structCost(key, S.priceMult * S.buildMul);
      const have = countStructs(key);
      const b = el('button', 'sbtn' + (this.wallet() < price || have >= def.max ? ' poor' : ''));
      b.dataset.price = price;
      b.innerHTML = '<span class="s-ico">' + def.icon + '</span>' +
        '<span class="s-txt"><b>' + def.name + '</b><small>' + (have >= def.max ? 'предел ' + def.max : 'стоит: ' + have + '/' + def.max) + '</small></span>' +
        '<span class="s-price"><span class="coin silver">◉</span>' + fmt(price) + '</span>';
      b.title = def.desc;
      b.onclick = () => buyStruct(key);
      this.structList.appendChild(b);
    }
    const rp = repairCost();
    const rb = this.btnRepair;
    rb.dataset.price = rp;
    rb.innerHTML = '<span class="s-ico">🧰</span><span class="s-txt"><b>Ремонт башни</b><small>+35% прочности (' + Math.ceil(G.tower.hp) + '/' + G.tower.maxHp + ')</small></span><span class="s-price"><span class="coin silver">◉</span>' + fmt(rp) + '</span>';
    rb.classList.toggle('poor', this.wallet() < rp || G.tower.hp >= G.tower.maxHp - 0.5);
  rb.disabled = G.state !== 'build';   // ремонт активен только между волнами
  rb.title = G.state === 'build' ? 'Ремонт башни: +35% прочности' : 'Ремонт доступен только между волнами';
  },

  hudSpeed() {
    const b = $('#speedLabel') || $('#btnSpeed');
    if (b) b.textContent = '×' + (G ? (G.speed || 1) : 1);
  },

  /* ---------------- ПАНЕЛЬ ВРАГОВ ТЕКУЩЕЙ ВОЛНЫ ---------------- */
  waveHtml() {
    const isBuild = G.state === 'build' || G.state === 'paused' && G.prevState === 'build';
    const w = isBuild ? G.wave + 1 : G.wave;
    let comp;
    if (isBuild) {
      comp = G.nextComp || {};
    } else {
      comp = {};
      for (const q of G.queue) comp[q.t] = (comp[q.t] || 0) + 1;
      for (const e of G.enemies) if (!e.dead) comp[e.type] = (comp[e.type] || 0) + 1;
      if (G.bossAlive && !G.bossAlive.dead) comp.boss = G.bossAlive.type;
    }
    const sig = w + '|' + (isBuild ? 'b' : 'w') + '|' + JSON.stringify(comp);
    const sc = enemyScale(w, G.diff);
    const rows = [];
    for (const t of Object.keys(comp)) {
      if (t === 'boss') {
        const b = (typeof comp.boss === 'string' && BOSSES[comp.boss]) ? BOSSES[comp.boss] : (w % 5 === 0 ? BOSSES[bossForWave(w)] : null);
        if (!b) continue;
        const hp = Math.round(b.hp * sc.hp * 0.44 * (1 + Math.max(0, (w / 5 - 1)) * 0.5));
        rows.push({ n: comp[t], html: '<div class="st-row boss"><span><i class="dot" style="background:' + b.color + '"></i> ' + b.name + '</span><b>HP ' + fmt(hp) + ' · ' + Math.round(b.atk * sc.dmg) + '</b></div>' });
        continue;
      }
      const d = ENEMIES[t];
      if (!d) continue;
      rows.push({
        n: comp[t],
        html: '<div class="st-row"><span><i class="dot" style="background:' + d.color + '"></i> ' + d.name + ' ×' + comp[t] + '</span><b>HP ' + fmt(Math.round(d.hp * sc.hp)) + ' · ' + (Math.round(d.atk * sc.dmg * 10) / 10) + '</b></div>'
      });
    }
    rows.sort((a, b) => b.n - a.n);
    return {
      sig,
      title: isBuild ? 'ВОЛНА ' + w + ' (ДАЛЕЕ)' : 'ВОЛНА ' + w + ' — ВРАГИ',
      html: rows.length ? rows.map(r => r.html).join('') : '<div class="st-row"><span>пусто</span><b></b></div>'
    };
  },
  renderEnemies() {
    if (!this.enemyPanel) return;
    if (!G || G.state === 'menu' || G.state === 'dead') { this.enemyPanel.classList.add('hidden'); return; }
    const w = this.waveHtml();
    if (w.sig === this._enemySig) { this.enemyPanel.classList.remove('hidden'); return; }
    this._enemySig = w.sig;
    this.enemyTitle.textContent = w.title;
    this.enemyBody.innerHTML = w.html;
    this.enemyPanel.classList.remove('hidden');
  },

  /* всплывающие панели (кнопки в верхнем ряду HUD на узких экранах) */
  showStatsPop() {
    this.setScreen(`
      <div class="panel-modal small">
        <h2>БАШНЯ</h2>
        <div class="pop-body">${this.statsHtml()}</div>
        <div class="modal-btns"><button class="big" id="popClose">ЗАКРЫТЬ</button></div>
      </div>`, { locked: false });
    $('#popClose').onclick = () => this.closeModal();
  },
  showWavePop() {
    const w = this.waveHtml();
    this.setScreen(`
      <div class="panel-modal small">
        <h2>${w.title}</h2>
        <div class="pop-body">${w.html}</div>
        <div class="modal-btns"><button class="big" id="popClose">ЗАКРЫТЬ</button></div>
      </div>`, { locked: false });
    $('#popClose').onclick = () => this.closeModal();
  },

  renderInv() {
    if (!G) return;
    const keys = Object.keys(G.inv).filter(k => G.inv[k] > 0);
    this.invBar.innerHTML = '';
    if (!keys.length) { this.invBar.classList.add('hidden'); return; }
    this.invBar.classList.remove('hidden');
    const lbl = el('div', 'inv-label', 'ПОСТРОИТЬ:');
    this.invBar.appendChild(lbl);
    for (const k of keys) {
      const def = STRUCTS[k];
      const b = el('button', 'inv-btn' + (G.placing === k ? ' active' : ''), def.icon + '<span class="inv-n">×' + G.inv[k] + '</span>');
      b.title = def.name + ' — ' + def.desc;
      b.onclick = () => {
        if (G.state === 'dead' || G.state === 'paused') { this.toast('Сейчас нельзя строить'); return; }
        G.placing = G.placing === k ? null : k;
        G.strike.aiming = false;
        this.renderInv(); this.hudAbility();
        if (G.placing) this.toast('Выберите место на арене (ПКМ — отмена)');
      };
      this.invBar.appendChild(b);
    }
    const cancel = el('button', 'inv-btn cancel', '✕');
    cancel.title = 'Отменить установку';
    cancel.onclick = () => { G.placing = null; this.renderInv(); };
    this.invBar.appendChild(cancel);
  },

  /* ---------------- БАННЕРЫ / ТОСТЫ ---------------- */
  banner(title, sub, color) {
    this.bannerEl.textContent = title;
    this.bannerSubEl.textContent = sub || '';
    this.bannerEl.style.color = color || '#dff6ff';
    this.bannerWrap.classList.remove('show');
    void this.bannerWrap.offsetWidth;
    this.bannerWrap.classList.add('show');
  },
  toast(msg) {
    const n = el('div', 'toast', msg);
    this.toasts.appendChild(n);
    requestAnimationFrame(() => n.classList.add('show'));
    setTimeout(() => { n.classList.remove('show'); setTimeout(() => n.remove(), 320); }, 2100);
    while (this.toasts.children.length > 4) { const f = this.toasts.children[0]; if (!f) break; f.remove(); }
  },
  toast2(msg) { this.toast(msg); },

  /* ---------------- ЭКРАНЫ ---------------- */
  setScreen(html, opts) {
    this.leftCol.classList.add('hidden');   // панели башни/волны не торчат над модалками
    this._onEsc = null;
    this.screen.innerHTML = html;
    this.screen.dataset.locked = opts && opts.locked ? '1' : '';
    this.overlay.classList.remove('hidden');
    this.modalOpen = true;
    resize();
  },
  closeModal() {
    this.overlay.classList.add('hidden');
    this.modalOpen = false;
    this.screen.innerHTML = '';
    this._onEsc = null;
    if (G && G.state !== 'dead') this.leftCol.classList.remove('hidden');
    resize();
  },

  /* куда возвращаемся по ESC/«назад» из подразделов */
  metaBack() {
    const f = this._metaFrom;
    if (f === 'menu') this.showMenu();
    else if (f === 'results') this.showResults(this._lastReward || 0, this._lastTransfer || 0, this._lastSilver || 0);
    else this.closeModal();
  },
  labBack() {
    if (this._labFrom === 'results') this.showResults(this._lastReward || 0, this._lastTransfer || 0, this._lastSilver || 0);
    else if (G) this.closeModal();
    else this.showMenu();
  },
  helpBack() {
    if (this._helpReturn === 'pause' && G) { this._helpReturn = null; this.openPause(); return; }
    this._helpReturn = null;
    if (G) this.closeModal();
    else this.showMenu();
  },

  showMenu() {
    if (G) { G = null; }
    this._shopOpen = false; this.shop.classList.add('hidden');
    this.hud.classList.add('hidden');
    this.invBar.classList.add('hidden');
    this.bossBar.classList.add('hidden');
    this.leftCol.classList.add('hidden');   // в меню панели башни и волны не нужны
    const best = SAVE.best.wave;
    const unlocked = (id) => {
      const d = DIFFS[id];
      return !d.req || ((SAVE.bestByDiff || {})[d.req.diff] || 0) >= d.req.waves;
    };
    const diffBtns = DIFFS.map(d => {
      const locked = !unlocked(d.id);
      return `<button class="diff ${SAVE.diff === d.id ? 'sel' : ''} ${locked ? 'locked' : ''}" data-d="${d.id}" ${locked ? 'disabled' : ''}>
        <span style="color:${d.color}">${d.name}</span>
        <small>${locked ? '🔒 ' + d.unlockReq : 'монет ×' + d.coins}</small></button>`;
    }).join('');
    this.setScreen(`
      <div class="menu">
        <div class="logo">
          <div class="logo-t">ПОСЛЕДНЯЯ</div>
          <div class="logo-b">БАШНЯ</div>
          <div class="logo-s">роглайк · оборона центра</div>
        </div>
        <div class="menu-coins"><span class="coin">◉</span> <b id="menuCoins">${fmt(SAVE.coins)}</b> золотых</div>
        <div class="diffs">${diffBtns}</div>
        <div class="menu-btns">
          <button class="big play" id="mPlay">▶ ИГРАТЬ</button>
          <button class="big" id="mMeta">🛒 ЛАВКА УЛУЧШЕНИЙ</button>
          <button class="big" id="mLab">🧪 ЛАБОРАТОРИЯ</button>
          <button class="big" id="mYan" style="display:none">💰 ЗОЛОТО ЗА ЯНЫ</button>
          <button class="big" id="mLb">🏆 ТАБЛИЦА ЛИДЕРОВ</button>
          <button class="big" id="mHelp">❓ КАК ИГРАТЬ</button>
        </div>
        <div class="menu-stats">
          <span>Рекорд: <b>${best}</b> волна</span>
          <span>Забеги: <b>${SAVE.stats.runs}</b></span>
          <span>Убийства: <b>${fmt(SAVE.stats.kills)}</b></span>
        </div>
      </div>`, { locked: true });
    this.screen.querySelectorAll('.diff').forEach(b => b.onclick = () => {
      SAVE.diff = parseInt(b.dataset.d, 10); markSave(); this.showMenu(); Sfx.tone(700, 0.06, 'triangle', 0.06);
    });
    $('#mPlay').onclick = () => { Sfx.resume(); startRun(); };
    $('#mMeta').onclick = () => this.showMeta('menu');
    $('#mLab').onclick = () => this.showLab('menu');
    $('#mYan').onclick = () => this.showYanShop();
    $('#mLb').onclick = () => this.showLeaderboard();
    if (YA.available) $('#mYan').style.display = '';
    YA._onAvail = () => { const b = $('#mYan'); if (b) b.style.display = ''; };
    $('#mHelp').onclick = () => this.showHelp();
    this.renderStats();
  },

  showHelp(fromGame) {
    const bestiary = Object.keys(ENEMIES).filter(k => ENEMIES[k].wave < 90).map(k => {
      const e = ENEMIES[k];
      return `<div class="best"><span class="dot" style="background:${e.color}"></span><b>${e.name}</b><small>волна ${e.wave} · ${
        e.ai === 'ranged' ? (e.heal ? 'лечит союзников' : e.summon ? 'призывает' : 'стреляет издалека') :
        e.ai === 'suicide' ? 'взрывается у башни' : e.fly ? 'летает над постройками' :
        e.shield ? 'щит регенерирует' : e.split ? 'делится при смерти' : 'идёт напролом'}</small></div>`;
    }).join('');

      bankRunCoins();
    }
    G = null;
    this.closeModal();
    this.closeShop();
    this.showMenu();
    if (reward > 0) this.toast('Забег засчитан: +' + fmt(reward) + ' золотых');
  },

  showBoss(e) { this._bossLast = -1; this.bossTick(); }
