<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070e">
<meta name="description" content="Последняя башня — рогалик-оборона: башня в центре отстреливается от волн врагов, между волнами лавка улучшений и постройки, после забега — постоянные улучшения за монеты.">
<title>ПОСЛЕДНЯЯ БАШНЯ — рогалик-оборона</title>
<style>/* =========================================================
   СТИЛИ: тёмный неон-интерфейс
   ========================================================= */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  background: #05070e; color: #dff6ff;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  user-select: none; touch-action: none;
}
#cv { position: fixed; inset: 0; display: block; z-index: 1; }
.hidden { display: none !important; }
.coin { color: #ffd23f; }
.coin.silver { color: #c0d0e0; }
b { font-weight: 700; }

/* ================= HUD ================= */
#hud { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
#hud button { pointer-events: auto; }

.hud-left { position: absolute; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 8px; max-width: min(46vw, 420px); }
.hpwrap { width: min(320px, 42vw); }
.hpbar {
  position: relative; height: clamp(16px, 2.4vmin, 24px); border-radius: 11px; overflow: hidden;
  background: rgba(6, 12, 22, .82); border: 1px solid rgba(140, 190, 255, .28);
  box-shadow: 0 4px 18px rgba(0, 0, 0, .5), inset 0 0 12px rgba(0, 0, 0, .5);
}
.hpbar .fill { position: absolute; inset: 0 auto 0 0; width: 100%; transition: width .12s linear; border-radius: 10px; }
.hpbar .fill.ok { background: linear-gradient(180deg, #7bf0a1, #2fa85c); box-shadow: 0 0 14px rgba(94, 224, 138, .5); }
.hpbar .fill.warn { background: linear-gradient(180deg, #ffe07a, #d9a021); box-shadow: 0 0 14px rgba(255, 204, 85, .5); }
.hpbar .fill.bad { background: linear-gradient(180deg, #ff8a95, #d9263c); box-shadow: 0 0 16px rgba(255, 85, 102, .6); animation: pulseBad .7s infinite; }
.hpbar .fill.shield { background: linear-gradient(180deg, rgba(140, 220, 255, .95), rgba(60, 140, 220, .8)); z-index: 2; height: 6px; top: 0; bottom: auto; }
@keyframes pulseBad { 50% { filter: brightness(1.45); } }
.hplabel { margin-top: 4px; font-size: clamp(10.5px, 1.5vmin, 13px); letter-spacing: .5px; opacity: .85; text-shadow: 0 1px 3px #000; }

.stat-row { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  display: flex; align-items: center; gap: 5px;
  padding: clamp(3px, .6vmin, 6px) clamp(8px, 1.4vmin, 12px); font-size: clamp(11px, 1.6vmin, 14px);
  background: rgba(8, 14, 26, .8); border: 1px solid rgba(140, 190, 255, .2); border-radius: 999px;
  text-shadow: 0 1px 3px #000;
}
.chip.coins b { color: #ffd23f; font-size: clamp(13px, 1.9vmin, 17px); }
.waveprog { width: min(320px, 42vw); height: 4px; border-radius: 3px; background: rgba(255, 255, 255, .08); overflow: hidden; }
#waveProgFill { height: 100%; width: 0; background: linear-gradient(90deg, #8ff0ff, #5ee08a); transition: width .2s; }

.build { width: min(320px, 42vw); }
.buildbar { height: 6px; border-radius: 4px; background: rgba(255, 255, 255, .09); overflow: hidden; }
#buildFill { height: 100%; width: 100%; background: linear-gradient(90deg, #ffd23f, #ff8a5a); transition: width .25s linear; }
.build-text { margin-top: 4px; font-size: 12px; opacity: .9; text-shadow: 0 1px 3px #000; }
.build-text .bonus { color: #5ee08a; }

.hud-right { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; }
.ibtn {
  width: clamp(34px, 4.6vmin, 48px); height: clamp(34px, 4.6vmin, 48px);
  border-radius: clamp(9px, 1.4vmin, 13px); font-size: clamp(15px, 2.1vmin, 20px); cursor: pointer;
  background: rgba(10, 17, 30, .85); color: #cfe9ff; border: 1px solid rgba(140, 190, 255, .25);
  display: grid; place-items: center; transition: .15s;
}
.ibtn:hover { background: rgba(24, 40, 66, .95); transform: translateY(-1px); }
.ibtn.off { opacity: .45; }
/* кнопки всплывающих панелей (башня/волна) — только на узких экранах */
.hud-pop { display: none; }
@media (max-width: 979px) { .hud-pop { display: grid; } }
.pop-body { display: flex; flex-direction: column; gap: 3px; max-height: 60vh; overflow-y: auto; padding-right: 2px; }

.hud-bottom {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
  display: flex; gap: 10px; align-items: center;
}
.cbtn {
  position: relative; display: flex; align-items: center; gap: 8px; overflow: hidden;
  padding: 10px 16px; border-radius: 13px; cursor: pointer; font-size: 13px; font-weight: 700;
  letter-spacing: .6px; color: #cfe9ff; background: rgba(10, 17, 30, .88);
  border: 1px solid rgba(140, 190, 255, .28); transition: .15s; white-space: nowrap;
}
.cbtn:hover { background: rgba(24, 40, 66, .95); }
.cbtn .ico { font-size: clamp(14px, 2vmin, 18px); }
.cbtn.strike { border-color: rgba(255, 210, 63, .5); color: #ffe9a8; min-width: 118px; justify-content: center; }
.cbtn.strike.ready { box-shadow: 0 0 18px rgba(255, 210, 63, .35); }
.cbtn.strike.aiming { background: rgba(90, 30, 40, .9); border-color: #ff5566; color: #ffd7dc; }
.cbtn.strike #strikeCd { position: absolute; inset: 0; pointer-events: none; }
.cbtn.strike small { position: absolute; inset: 0; display: grid; place-items: center; font-size: 18px; color: #fff; text-shadow: 0 2px 6px #000; }
/* пока удар перезаряжается — цифра отката вместо надписи, без наложений */
.cbtn.strike.cooling > .ico, .cbtn.strike.cooling > span:nth-child(3) { visibility: hidden; }
.cbtn.start { background: linear-gradient(180deg, #2f6b45, #1d4a2e); border-color: #5ee08a; color: #eaffef; box-shadow: 0 0 20px rgba(94, 224, 138, .3); }
.cbtn.start:hover { filter: brightness(1.15); }

#invBar {
  position: absolute; left: 12px; bottom: 14px; display: flex; gap: 8px; align-items: center;
  padding: 8px 10px; border-radius: 14px; background: rgba(8, 14, 26, .85);
  border: 1px solid rgba(140, 190, 255, .22);
}
.inv-label { font-size: 11px; letter-spacing: 1px; opacity: .6; }
.inv-btn {
  position: relative; width: 46px; height: 46px; border-radius: 12px; font-size: 21px; cursor: pointer;
  background: rgba(20, 32, 54, .95); border: 1px solid rgba(140, 190, 255, .3); color: #fff; transition: .15s;
}
.inv-btn:hover { transform: translateY(-2px); border-color: #8ff0ff; }
.inv-btn.active { background: rgba(50, 90, 130, .95); border-color: #8ff0ff; box-shadow: 0 0 16px rgba(143, 240, 255, .5); }
.inv-btn .inv-n { position: absolute; right: -4px; bottom: -4px; font-size: 11px; font-weight: 700; background: #ffd23f; color: #221a00; border-radius: 7px; padding: 0 4px; }
.inv-btn.cancel { font-size: 15px; opacity: .7; }

/* босс */
#bossBar { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: min(520px, 62vw); text-align: center; }
#bossName { font-size: 13px; font-weight: 800; letter-spacing: 3px; color: #ff9aa5; text-shadow: 0 0 12px rgba(255, 85, 102, .8); margin-bottom: 4px; }
.bossbar { height: 12px; border-radius: 7px; background: rgba(6, 12, 22, .85); border: 1px solid rgba(255, 85, 102, .45); overflow: hidden; }
#bossFill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff5566, #ff9a5a); box-shadow: 0 0 16px rgba(255, 85, 102, .7); transition: width .15s; }

/* ================= ЛАВКА ================= */
#shop {
  position: fixed; z-index: 8; top: 0; right: 0; bottom: 0; width: clamp(300px, 34vw, 420px);
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, rgba(9, 15, 28, .96), rgba(6, 10, 20, .98));
  border-left: 1px solid rgba(140, 190, 255, .22);
  box-shadow: -18px 0 50px rgba(0, 0, 0, .55);
  backdrop-filter: blur(6px);
}
.shop-head { padding: 14px 16px 10px; border-bottom: 1px solid rgba(140, 190, 255, .14); }
.shop-title { font-size: 19px; font-weight: 900; letter-spacing: 4px; color: #ffd23f; text-shadow: 0 0 18px rgba(255, 210, 63, .4); }
.shop-sub { font-size: 11.5px; opacity: .68; margin-top: 3px; line-height: 1.35; }
.shop-sub b { color: #ffd23f; font-size: 14px; }
.next-wave { padding: 9px 16px; font-size: 12px; color: #a9d8ff; background: rgba(30, 60, 100, .22); border-bottom: 1px solid rgba(140, 190, 255, .12); line-height: 1.4; }
.sec-title { display: flex; align-items: center; justify-content: space-between; padding: 11px 16px 6px; font-size: 11px; letter-spacing: 2px; opacity: .75; font-weight: 800; }
.reroll {
  pointer-events: auto; cursor: pointer; font-size: 11px; padding: 5px 10px; border-radius: 9px;
  background: rgba(40, 70, 110, .55); border: 1px solid rgba(140, 190, 255, .3); color: #cfe9ff;
}
.reroll:hover:not(:disabled) { background: rgba(60, 100, 150, .7); }
.reroll:disabled { opacity: .35; cursor: default; }
.shelf { padding: 4px 12px 8px; display: flex; flex-direction: column; gap: 7px; overflow-y: auto; flex: 0 1 auto; flex-shrink: 0; max-height: 46vh; }
.card {
  position: relative; display: flex; gap: 8px; align-items: center; padding: 7px 10px 7px 12px;
  border-radius: 12px; cursor: pointer; background: rgba(18, 28, 46, .85);
  border: 1px solid rgba(140, 190, 255, .18); border-left: 3px solid #9fb4c7; transition: .13s;
}
.card:hover { transform: translateX(-3px); background: rgba(28, 44, 70, .95); }
.card.r-rare { border-left-color: #59c8ff; }
.card.r-epic { border-left-color: #c86bff; box-shadow: inset 0 0 22px rgba(200, 107, 255, .1); }
.card.poor { opacity: .5; }
.card.poor:hover { transform: none; }
.card.maxed { opacity: .42; cursor: default; }
.c-key { position: absolute; top: 4px; left: 5px; font-size: 9px; opacity: .4; }
.c-ico { font-size: clamp(18px, 2.6vmin, 24px); width: 26px; text-align: center; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .6)); }
.c-body { flex: 1; min-width: 0; }
.c-name { font-size: clamp(11px, 1.6vmin, 14px); font-weight: 700; color: #eaf6ff; }
.c-lv { font-size: 10.5px; opacity: .55; font-weight: 600; }
.c-desc {
  font-size: clamp(9.5px, 1.4vmin, 12px); opacity: .72; line-height: 1.25; margin-top: 1px;
  display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
}
.c-rar { display: none; }   /* редкость видна по цвету кромки карточки */
.c-price { font-size: clamp(11px, 1.6vmin, 14px); font-weight: 800; color: #ffd23f; white-space: nowrap; }

.structs { padding: 0 12px 6px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; flex-shrink: 0; }
.sbtn {
  display: flex; gap: 9px; align-items: center; width: 100%; text-align: left; cursor: pointer;
  padding: 8px 10px; border-radius: 11px; background: rgba(18, 28, 46, .8);
  border: 1px solid rgba(140, 190, 255, .18); color: #dff6ff; transition: .13s; font-family: inherit;
}
.sbtn:hover:not(.poor) { background: rgba(30, 48, 76, .95); transform: translateX(-2px); }
.sbtn.poor { opacity: .45; cursor: default; }
.s-ico { font-size: clamp(17px, 2.4vmin, 22px); width: 26px; text-align: center; }
.s-txt { flex: 1; min-width: 0; }
.s-txt b { font-size: clamp(11px, 1.6vmin, 14px); display: block; }
.s-txt small { font-size: clamp(9.5px, 1.4vmin, 12px); opacity: .6; }
.s-price { font-size: clamp(11px, 1.6vmin, 14px); font-weight: 800; color: #ffd23f; white-space: nowrap; }
.sbtn.repair { margin: 4px 12px 8px; width: calc(100% - 24px); border-color: rgba(123, 217, 72, .35); }
.sbtn:disabled { opacity: .45; cursor: not-allowed; }
.shop-foot { margin-top: auto; padding: 10px 12px 14px; border-top: 1px solid rgba(140, 190, 255, .14); }
.shop-scroll { overflow-y: auto; flex: 1 1 auto; display: flex; flex-direction: column; }

.big {
  width: 100%; padding: clamp(10px, 1.6vmin, 15px); border-radius: 13px; cursor: pointer;
  font-size: clamp(12px, 1.8vmin, 15px); font-weight: 800;
  letter-spacing: 1.5px; color: #dff6ff; background: rgba(28, 44, 70, .9);
  border: 1px solid rgba(140, 190, 255, .3); font-family: inherit; transition: .15s;
}
.big:hover { background: rgba(44, 68, 106, .95); transform: translateY(-1px); }
.big.play { background: linear-gradient(180deg, #2f7d55, #1c5636); border-color: #5ee08a; color: #eaffef; box-shadow: 0 6px 26px rgba(94, 224, 138, .25); }
.big.start { background: linear-gradient(180deg, #2f6b45, #1d4a2e); border-color: #5ee08a; color: #eaffef; }
.ghost {
  background: linear-gradient(180deg, rgba(64, 16, 26, .65), rgba(40, 10, 18, .8));
  border: 1px solid rgba(255, 85, 102, .5); color: #ff9aa5; width: auto;
  padding: 11px 18px; font-size: 12px; letter-spacing: 1.5px; border-radius: 14px;
  text-shadow: 0 0 12px rgba(255, 85, 102, .45);
  box-shadow: inset 0 0 18px rgba(255, 85, 102, .12), 0 4px 18px rgba(0, 0, 0, .35);
  transition: .15s;
}
.ghost:hover {
  border-color: rgba(255, 120, 130, .85); background: rgba(90, 22, 34, .85);
  box-shadow: inset 0 0 24px rgba(255, 85, 102, .2), 0 4px 22px rgba(255, 85, 102, .15);
}
.empty { padding: 18px; text-align: center; opacity: .5; font-size: 12px; }

/* ================= БАННЕР / ТОСТЫ ================= */
#bannerWrap {
  position: fixed; z-index: 9; top: 18%; left: 0; right: 0; text-align: center;
  pointer-events: none; opacity: 0;
}
#bannerWrap.show { animation: bannerIn 2.4s ease-out forwards; }
#banner { font-size: clamp(26px, 5.4vw, 52px); font-weight: 900; letter-spacing: 6px; text-shadow: 0 0 30px currentColor, 0 4px 12px #000; }
#bannerSub { font-size: clamp(12px, 2vw, 18px); letter-spacing: 3px; opacity: .9; margin-top: 6px; text-shadow: 0 2px 8px #000; }
@keyframes bannerIn {
  0% { opacity: 0; transform: scale(.85) translateY(14px); }
  12% { opacity: 1; transform: scale(1) translateY(0); }
  74% { opacity: 1; }
  100% { opacity: 0; transform: scale(1.04); }
}
#toasts { position: fixed; z-index: 10; left: 50%; bottom: 84px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast {
  padding: clamp(6px, 1.1vmin, 9px) clamp(12px, 2vmin, 17px); border-radius: 999px;
  font-size: clamp(11px, 1.6vmin, 13.5px); background: rgba(10, 17, 30, .92);
  border: 1px solid rgba(140, 190, 255, .28); opacity: 0; transform: translateY(8px); transition: .28s;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .45); max-width: 82vw; text-align: center;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* ================= МОДАЛКИ ================= */
#overlay {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 18px;
  background: radial-gradient(circle at 50% 40%, rgba(12, 22, 40, .82), rgba(3, 5, 10, .94));
  backdrop-filter: blur(3px); overflow-y: auto;
}
#screen { width: 100%; max-width: 860px; }
.panel-modal {
  background: linear-gradient(180deg, rgba(14, 22, 38, .97), rgba(8, 13, 24, .99));
  border: 1px solid rgba(140, 190, 255, .22); border-radius: clamp(14px, 2.6vmin, 22px);
  padding: clamp(16px, 3vmin, 26px) clamp(18px, 3.4vmin, 30px);
  box-shadow: 0 30px 90px rgba(0, 0, 0, .7), inset 0 0 60px rgba(60, 120, 200, .05);
  max-height: 92vh; overflow-y: auto;
}
.panel-modal.small { max-width: 420px; margin: 0 auto; }
.panel-modal h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: 3px; text-transform: uppercase; color: #8ff0ff; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.panel-modal h2.dead { color: #ff5566; text-shadow: 0 0 26px rgba(255, 85, 102, .55); justify-content: center; font-size: 26px; letter-spacing: 5px; }
.panel-modal h3 { margin: 16px 0 6px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: #ffd23f; }
.panel-modal p { font-size: 13px; line-height: 1.55; opacity: .82; margin: 6px 0; }
.panel-modal ul { font-size: 12.5px; line-height: 1.65; opacity: .82; padding-left: 18px; margin: 6px 0; }
.hint { font-size: 12px; opacity: .6; }
.modal-btns { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.modal-btns .big { flex: 1; min-width: 150px; }
kbd {
  display: inline-block; padding: 1px 7px; border-radius: 6px; font-size: 11px; font-family: inherit;
  background: rgba(60, 90, 130, .4); border: 1px solid rgba(140, 190, 255, .35); margin-right: 3px;
}
.help-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.best-wrap { display: flex; flex-direction: column; gap: 4px; padding-right: 4px; }  /* скролл общий, у модалки */
.best { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.best b { min-width: 108px; }
.best small { opacity: .6; font-size: 11px; }
.dot { width: 11px; height: 11px; border-radius: 50%; box-shadow: 0 0 10px currentColor; flex: none; }

/* меню */
.menu { text-align: center; padding: 10px; }
.logo { margin-bottom: 14px; }
.logo-t { font-size: clamp(15px, 3vw, 22px); letter-spacing: 12px; opacity: .75; }
.logo-b {
  font-size: clamp(40px, 9vw, 78px); font-weight: 900; letter-spacing: 8px; line-height: 1;
  background: linear-gradient(180deg, #dff6ff, #5aa8e0 60%, #2a5f96);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 26px rgba(90, 170, 240, .45));
}
.logo-s { font-size: 12px; letter-spacing: 4px; opacity: .55; margin-top: 8px; }
.menu-coins { font-size: 17px; margin: 8px 0 16px; }
.menu-coins b { color: #ffd23f; font-size: 22px; }
.diffs { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }
.diff {
  padding: 9px 16px; border-radius: 12px; cursor: pointer; background: rgba(18, 28, 46, .8);
  border: 1px solid rgba(140, 190, 255, .22); color: #dff6ff; font-family: inherit; transition: .15s; min-width: 118px;
}
.diff small { display: block; font-size: 10px; opacity: .55; margin-top: 3px; }
.diff b, .diff span { font-size: 13px; font-weight: 800; letter-spacing: 1px; }
.diff.sel { border-color: #8ff0ff; box-shadow: 0 0 22px rgba(143, 240, 255, .28); background: rgba(30, 56, 88, .9); }
.diff.locked { opacity: .38; cursor: not-allowed; }
.menu-btns { display: flex; flex-direction: column; gap: 9px; max-width: 340px; margin: 0 auto 16px; }
.menu-stats { display: flex; gap: 16px; justify-content: center; font-size: 12px; opacity: .6; flex-wrap: wrap; }
.menu-stats b { color: #8ff0ff; }

/* мета-магазин и лаборатория */
.panel-modal.lab h2 { color: #c86bff; text-shadow: 0 0 22px rgba(200, 107, 255, .4); }
.wallet { font-size: 15px; color: #ffd23f; letter-spacing: 0; }
.wallet b { font-size: 19px; }
.meta-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; max-height: 54vh; overflow-y: auto; padding-right: 4px; }
.mrow {
  display: flex; gap: 11px; align-items: center; padding: 9px 11px; border-radius: 12px;
  background: rgba(18, 28, 46, .8); border: 1px solid rgba(140, 190, 255, .16);
}
.mrow.poor { opacity: .55; }
.mrow.maxed { border-color: rgba(94, 224, 138, .4); background: rgba(20, 44, 32, .55); }
.m-ico { font-size: 22px; width: 30px; text-align: center; }
.m-body { flex: 1; min-width: 0; }
.m-name { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 8px; height: 8px; border-radius: 2px; background: rgba(255, 255, 255, .14); display: block; }
.pips i.on { background: #5ee08a; box-shadow: 0 0 8px rgba(94, 224, 138, .7); }
.m-desc { font-size: 11px; opacity: .7; margin-top: 2px; }
.m-desc .now { color: #5ee08a; opacity: .95; font-weight: 600; }
.m-buy {
  padding: 8px 12px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 800;
  background: rgba(40, 70, 110, .6); border: 1px solid rgba(140, 190, 255, .3); color: #ffd23f;
  font-family: inherit; white-space: nowrap; transition: .13s;
}
.m-buy:hover:not(:disabled) { background: rgba(60, 100, 150, .8); }
.m-buy:disabled { opacity: .4; cursor: default; color: #cfe9ff; }

/* результаты */
.res-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.res { background: rgba(18, 28, 46, .8); border: 1px solid rgba(140, 190, 255, .16); border-radius: 12px; padding: 11px; text-align: center; }

<script>/* ===== core.js ===== */
/* =========================================================
   CORE: утилиты, сохранение, звук
   ========================================================= */
'use strict';

const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const chance = (p) => Math.random() < p;
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const sign = (v) => (v < 0 ? -1 : 1);
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const dist = (ax, ay, bx, by) => Math.sqrt(dist2(ax, ay, bx, by));
const fmt = (n) => {
  n = Math.round(n);
  if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (Math.abs(n) >= 10000) return (n / 1000).toFixed(1) + 'k';
  return String(n);
};

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* Взвешенный выбор: items = [{w: вес, ...}] */
function weightedPick(items) {
  let total = 0;
  for (const it of items) total += it.w;
  let r = Math.random() * total;
  for (const it of items) { r -= it.w; if (r <= 0) return it; }
  return items[items.length - 1];
}

/* Короткое имя волны/времени */
function mmss(t) {
  t = Math.max(0, Math.floor(t));
  return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
}

/* ---------------------------------------------------------
   СОХРАНЕНИЕ (localStorage может быть недоступен в песочнице
   — тогда тихо работаем в памяти)
   --------------------------------------------------------- */
const SAVE_KEY = 'towerRogueSave_v1';

/* Хранилище: localStorage → sessionStorage → память.
   В песочницах без allow-same-origin localStorage бросает исключение —
   тогда тихо падаем на sessionStorage/память и помечаем degraded. */
const Store = {
  _mem: null,
  _ok: null,               // 'local' | 'session' | false
  _probe() {
    if (this._ok !== null) return this._ok;
    try { window.localStorage.setItem('__t', '1'); window.localStorage.removeItem('__t'); this._ok = 'local'; return this._ok; } catch (e) { }
    try { window.sessionStorage.setItem('__t', '1'); window.sessionStorage.removeItem('__t'); this._ok = 'session'; return this._ok; } catch (e) { }
    this._ok = false;
    return this._ok;
  },
  read() {
    const k = this._probe();
    if (k === 'local') { try { return window.localStorage.getItem(SAVE_KEY); } catch (e) { return null; } }
    if (k === 'session') { try { return window.sessionStorage.getItem(SAVE_KEY); } catch (e) { return null; } }
    return this._mem;
  },
  write(str) {
    const k = this._probe();
    if (k === 'local') { try { window.localStorage.setItem(SAVE_KEY, str); return true; } catch (e) { this._ok = false; } }
    if (k === 'session') { try { window.sessionStorage.setItem(SAVE_KEY, str); return true; } catch (e) { this._ok = false; } }
    this._mem = str;
    return false;
  },
  clear() {
    try { window.localStorage.removeItem(SAVE_KEY); } catch (e) { }
    try { window.sessionStorage.removeItem(SAVE_KEY); } catch (e) { }
    this._mem = null;
  },
  degraded() { return this._probe() !== 'local'; }
};

const DEFAULT_SAVE = () => ({
  coins: 0,
  meta: {},                 // id -> уровень мета-улучшения
  lab: {},                  // id -> уровень улучшения лаборатории
  diff: 0,                  // выбранная сложность
  unlockedDiff: 0,          // макс. открытая сложность
  best: { wave: 0, kills: 0, coins: 0 },
  bestByDiff: {},           // рекорд волны по каждой сложности (ими открываются следующие)
  stats: { runs: 0, kills: 0, waves: 0, bosses: 0, time: 0 },
  sound: true,
  shake: true,
  dmgNumbers: true,
  seenTutorial: false
});

let SAVE = DEFAULT_SAVE();

function loadSave() {
  let raw = null;
  try { raw = Store.read(); } catch (e) { raw = null; }
  const base = DEFAULT_SAVE();
  if (raw) {
    try {
      const p = JSON.parse(raw);
      SAVE = Object.assign(base, p);
      SAVE.meta = Object.assign({}, p.meta || {});
      SAVE.lab = Object.assign({}, p.lab || {});
      SAVE.best = Object.assign(base.best, p.best || {});
      SAVE.stats = Object.assign(base.stats, p.stats || {});
      SAVE.bestByDiff = Object.assign({}, p.bestByDiff || {});
      // миграция старых сейвов: глобальный рекорд считаем рекордом Обычной
      if (!p.bestByDiff && SAVE.best.wave > 0) SAVE.bestByDiff[0] = SAVE.best.wave;
    } catch (e) { SAVE = base; }
  } else SAVE = base;
  return SAVE;
}

let saveDirty = false;
function markSave() { saveDirty = true; }
function flushSave() {
  if (!saveDirty) return;
  saveDirty = false;
  try { Store.write(JSON.stringify(SAVE)); } catch (e) { }
  if (typeof YA !== 'undefined') YA.scheduleCloud();   // облако Яндекс Игр (дебаунс внутри)
}

/* ---------------------------------------------------------
   ЗВУК: маленький процедурный синтезатор на WebAudio
   --------------------------------------------------------- */
const Sfx = {
  ctx: null,
  master: null,
  budget: 0,          // сколько звуков осталось в этом кадре
  enabled: true,

  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { this.enabled = false; return; }
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.enabled = false; }
  },
  resume() {
    this.init();
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => { });
  },
  ok() {
    if (!this.enabled || !SAVE.sound) return false;
    this.init();
    if (!this.ctx) return false;
    if (this.budget <= 0) return false;
    this.budget--;
    return true;
  },
  tone(freq, dur, type = 'square', vol = 0.2, slideTo = null, delay = 0) {
    if (!this.ok()) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(20, freq), t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.02, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },
  noise(dur, vol = 0.25, lp = 1200, delay = 0) {
    if (!this.ok()) return;
    const t0 = this.ctx.currentTime + delay;
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, Math.max(16, n), this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0);
  },

  // --- конкретные звуки ---
  shoot() { this.tone(rand(520, 620), 0.06, 'square', 0.055, 220); },
  shootHeavy() { this.tone(180, 0.1, 'sawtooth', 0.09, 70); this.noise(0.07, 0.06, 900); },
  hit() { this.tone(rand(300, 380), 0.035, 'triangle', 0.05, 180); },
  crit() { this.tone(880, 0.07, 'square', 0.07, 1500); },
  kill() { this.noise(0.09, 0.11, 1600); this.tone(rand(150, 220), 0.08, 'triangle', 0.05, 80); },
  boom() { this.noise(0.4, 0.3, 700); this.tone(90, 0.35, 'sine', 0.22, 32); },
  smallBoom() { this.noise(0.18, 0.16, 1100); this.tone(140, 0.15, 'sine', 0.1, 50); },

/* ---------- ГЕНЕРАТОР ВОЛН ---------- */
/* Возвращает список спавнов: [{t: тип, at: время, ang: угол}] */
function buildWave(wave, diff) {
  const D = DIFFS[diff];
  const list = [];
  const ramp = wave < 5 ? 0.7 : 1;
  const count = Math.min(85, Math.round((5 + wave * 1.75 + Math.pow(wave, 1.3) * 0.32) * D.count * ramp));

  // базовые веса типов
  const W0 = {
    crawler: 10, runner: 7, spitter: 5, tank: 3.2, bomber: 4,
    splitter: 4, flyer: 5, shielder: 3.4, summoner: 2.4, healer: 2.2
  };
  const pool = Object.keys(W0).filter(t => ENEMIES[t].wave <= wave);
  const weights = pool.map(t => {
    let w = W0[t];
    const age = wave - ENEMIES[t].wave;           // старые типы чуть реже, новые — чаще
    w *= age <= 2 ? 1.35 : age <= 5 ? 1.0 : 0.72;
    // «тяжёлые» типы не должны занимать всю волну
    if (t === 'tank' || t === 'shielder') w *= clamp(1.4 - wave * 0.012, 0.55, 1.4);
    return { t, w };
  });
  const cap = {};                                  // потолок доли дорогих типов
  for (let i = 0; i < count; i++) {
    let t = weightedPick(weights).t;
    cap[t] = (cap[t] || 0) + 1;
    const maxShare = (t === 'tank' || t === 'shielder' || t === 'summoner' || t === 'healer') ? 0.28 : 1;
    if (cap[t] > count * maxShare) t = 'crawler';
    list.push({ t });
  }

  // тайминг: отряды с разных сторон
  const squads = clamp(2 + Math.floor(wave / 4), 2, 7);
  const squadAngles = [];
  const baseAng = rand(0, TAU);
  for (let i = 0; i < squads; i++) squadAngles.push(baseAng + (i / squads) * TAU + rand(-0.3, 0.3));
  const gap = clamp(0.52 - wave * 0.013, 0.13, 0.52);
  let time = 0.8;
  shuffle(list);
  for (let i = 0; i < list.length; i++) {
    const sq = squadAngles[i % squads];
    list[i].at = time;
    list[i].ang = sq + rand(-0.34, 0.34);
    time += gap * rand(0.7, 1.3);
  }
  return list;
}

function bossForWave(wave) {
  const idx = Math.floor((wave / 5 - 1)) % 3;
  return ['crusher', 'brood', 'storm'][idx];
}

/* Масштабирование HP/урона врага по волне */
function enemyScale(wave, diff) {
  const D = DIFFS[diff];
  return {
    hp: D.hp * Math.pow(1.152, wave - 1) * (1 + wave * 0.008) * (1 + Math.max(0, wave - 10) * 0.035),
    dmg: D.dmg * (1 + (wave - 1) * 0.075) * (1 + Math.max(0, wave - 12) * 0.02),
    speed: D.speed * (1 + Math.min(0.32, (wave - 1) * 0.014)),
    gold: 1 + (wave - 1) * 0.07
  };
}

/* ---------- НАБОРЫ ЗОЛОТА ЗА ЯНЫ (Яндекс Игры) ----------
   id должны совпадать с каталогом покупок в консоли разработчика;
   цены в янах задаются там же. */
const YAN_PACKS = [
  { id: 'gold_small',  gold: 1500,  name: 'Мешок золота',   icon: '💰' },
  { id: 'gold_medium', gold: 8000,  name: 'Сундук золота',  icon: '🧰' },
  { id: 'gold_large',  gold: 20000, name: 'Обоз золота',    icon: '🏆' }
];

const labCost = (m, lv) => Math.round(m.cost * Math.pow(m.grow, lv));

/* ---------- РАСЧЁТ ХАРАКТЕРИСТИК ---------- */
function computeStats(runLevels) {
  const S = statCopy();
  for (const m of META) {
    const lv = SAVE.meta[m.id] || 0;
    if (lv > 0) m.apply(S, lv);
  }
  for (const m of LAB) {
    const lv = (SAVE.lab || {})[m.id] || 0;
    if (lv > 0) m.apply(S, lv);
  }
  S.maxHp = Math.round(S.maxHp);
  S.baseMaxHp = S.maxHp;          // HP до внутризабежных улучшений
  for (const id in runLevels) {
    const def = SHOP_BY_ID[id];
    if (def && def.apply) def.apply(S, runLevels[id]);
  }
  // финальные округления
  S.maxHp = Math.round(S.maxHp);
  S.dmg = Math.max(1, S.dmg);
  S.fireRate = Math.max(0.1, S.fireRate);
  S.priceMult = clamp(S.priceMult, 0.4, 1);
  S.buildMul = clamp(S.buildMul, 0.45, 1);
  S.dmgReduce = clamp(S.dmgReduce || 0, 0, 0.6);   // общий предел снижения урона 60% во всех источниках
  S.goldMult = S.goldMult * (S.silverMult || 1);   // серебро забега: алчность × магнат
  return S;
}

/* Цена товара в лавке забега */
function shopCost(def, boughtLv, wave, priceMult) {
  const waveFactor = 1 + Math.max(0, wave - 1) * 0.045;
  return Math.max(5, Math.round(def.cost * Math.pow(def.grow, boughtLv) * priceMult * waveFactor));
}

/* Стоимость постройки с учётом скидок */
function structCost(key, priceMult) {
  return Math.max(5, Math.round(STRUCTS[key].cost * priceMult));
}


/* ===== yandex.js ===== */
/* =========================================================
   YANDEX GAMES: SDK, rewarded-реклама, покупки за яны, облачные сейвы.
   Без SDK (локальный запуск, dist с флешки) все методы — безопасные
   заглушки: игра полностью играбельна офлайн.
   ========================================================= */
'use strict';

const YA = {
  sdk: null,
  player: null,
  payments: null,
  catalog: [],
  available: false,
  _readyWanted: false,
  _readyDone: false,
  _cloudT: 0,
  _onAvail: null,

  /* SDK грузится внешним скриптом и может появиться не сразу — ждём до 2 сек */
  init() {
    const tryInit = (n) => {
      if (typeof YaGames !== 'undefined') {
        YaGames.init().then((sdk) => {
          this.sdk = sdk;
          this.available = true;
          if (this._readyWanted) this.ready();
          this._initPlayer();
          this._initPayments();
          this._initLb();
          if (this._onAvail) { try { this._onAvail(); } catch (e) { } }
        }).catch(() => { });
      } else if (n < 10) {
        setTimeout(() => tryInit(n + 1), 200);
      }
    };
    tryInit(0);
  },

  /* игра загружена и показана — платформе можно убирать прелоадер */
  ready() {
    this._readyWanted = true;
    if (!this.sdk || this._readyDone) return;
    this._readyDone = true;
    try { this.sdk.features.LoadingAPI.ready(); } catch (e) { }
  },

  /* границы геймплея: между ними платформа не показывает рекламу */
  gameplayStart() { if (this.sdk) { try { this.sdk.features.GameplayAPI.start(); } catch (e) { } } },
  gameplayStop() { if (this.sdk) { try { this.sdk.features.GameplayAPI.stop(); } catch (e) { } } },

  /* ---------- REWARDED: «посмотри рекламу — получи бонус» ---------- */
  showRewarded(onReward, onFail) {
    if (!this.sdk || !this.sdk.adv) { if (onFail) onFail(); return false; }
    let rewarded = false;
    try {
      this.sdk.adv.showRewardedVideo({
        callbacks: {
          onOpen: () => { },
          onRewarded: () => { rewarded = true; },
          onClose: () => { if (rewarded && onReward) onReward(); else if (!rewarded && onFail) onFail(); },
          onError: () => { if (onFail) onFail(); }
        }
      });
      return true;
    } catch (e) { if (onFail) onFail(); return false; }
  },

  /* ---------- ОБЛАЧНЫЕ СЕЙВЫ ИГРОКА ---------- */
  _initPlayer() {
    if (!this.sdk.getPlayer) return;
    this.sdk.getPlayer({ scopes: false }).then((player) => {
      this.player = player;
      return player.getData();
    }).then((data) => {
      this._mergeCloud(data);
    }).catch(() => { });
  },
  _mergeCloud(c) {
    const s = c && c.save;
    if (!s || typeof s !== 'object') return;
    const base = DEFAULT_SAVE();
    const next = Object.assign(base, s);
    next.meta = Object.assign({}, s.meta);
    next.lab = Object.assign({}, s.lab);
    next.best = Object.assign(base.best, s.best);
    next.bestByDiff = Object.assign({}, s.bestByDiff);
    next.stats = Object.assign(base.stats, s.stats);
    // монеты и рекорды не понижайте: вдруг локально наиграли больше
    next.coins = Math.max(SAVE.coins || 0, s.coins || 0);
    if ((SAVE.best.wave || 0) > (next.best.wave || 0)) next.best.wave = SAVE.best.wave;
    for (const k in (SAVE.bestByDiff || {})) {
      next.bestByDiff[k] = Math.max(next.bestByDiff[k] || 0, SAVE.bestByDiff[k] || 0);
    }
    SAVE = next;
    markSave(); flushSave();
    if (typeof UI !== 'undefined' && !G) UI.showMenu();
  },
  /* дебаунс: не пишем в облако на каждый чих, раз в 3 секунды максимум */
  scheduleCloud() {
    if (!this.player || this._cloudT) return;
    this._cloudT = setTimeout(() => { this._cloudT = 0; this.writeCloudNow(); }, 3000);
  },
  writeCloudNow() {
    if (this._cloudT) { clearTimeout(this._cloudT); this._cloudT = 0; }
    if (!this.player) return;
    try { this.player.setData({ save: JSON.parse(JSON.stringify(SAVE)) }, true); } catch (e) { }
  },

  /* ---------- ПОКУПКИ ЗА ЯНЫ: наборы золота ---------- */
  _initPayments() {
    if (!this.sdk.getPayments) return;
    this.sdk.getPayments().then((p) => {
      this.payments = p;
      return p.getCatalog();
    }).then((cat) => {
      this.catalog = (cat && cat.items) || [];
    }).catch(() => { });
  },
  /* покупка: грант золота -> обязательный consume токена */
  buy(itemId, onDone) {
    if (!this.payments) { if (onDone) onDone(false); return false; }
    this.payments.purchase({ id: itemId }).then((purchase) => {
      const pack = YAN_PACKS.find(p => p.id === itemId);
      if (pack) {
        SAVE.coins += pack.gold;
        markSave(); flushSave();
      }
      if (purchase && purchase.purchaseToken) this.payments.consume(purchase.purchaseToken);
      if (onDone) onDone(!!pack);
    }).catch(() => { if (onDone) onDone(false); });
    return true;
  },

  /* ---------- ТАБЛИЦА ЛИДЕРОВ ----------
   Имя доски в консоли: bestwawe (маска [a-zA-Z0-9]); счёт = волна на сложности Ад. */
  lb: null,
  _initLb() {
    if (this.sdk && this.sdk.getLeaderboards) {
      this.sdk.getLeaderboards().then((lb) => { this.lb = lb; }).catch(() => { });
    }
  },
  submitScore(v) {
    if (this.lb) { try { this.lb.setScore('bestwawe', v); } catch (e) { } }
  },
  getTop(n, cb) {
    if (!this.lb) { cb(null); return; }
    this.lb.getEntries('bestwawe', { quantityTop: n || 10, includeUser: true })
      .then((res) => {
        const rows = (res && res.entries) || [];
        cb(rows.map((e) => ({
          rank: e.rank,
          score: e.score,
          name: (e.player && (e.player.publicName || e.player.name)) || '???'
        })));
      })
      .catch(() => cb(null));
  }
};


/* ===== game.js ===== */
/* =========================================================
   GAME: состояние, цикл, волны, враги, снаряды, постройки
   ========================================================= */
'use strict';

const ARENA_R = 460;       // радиус игровой арены
const SPAWN_R = 585;       // откуда приходят враги
const SPAN_X = 1420;       // сколько мировых единиц влезает по ширине
const SPAN_Y = 1250;
const BUILD_TIME = 45;     // секунд на подготовку между волнами
const WAVE_TIME_LIMIT = 60; // предел длины волны: дальше враги отступают
const TOWER_R = 27;
const HEAL_CAP = 0.3;      // предел входящего лечения: доля макс. HP цели в секунду

/* Тестовый банк: монеты, которые выдаются в начало каждого забега,
   чтобы быстро проверять улучшения. Не переносятся в кошелёк.
   По умолчанию ВЫКЛЮЧЕН: с бесплатными 10 000 монет экономика забега
   теряет смысл (любые цены тонут в тестовом банке).
   Для отладки включается параметром адреса: index.html?testgold=10000
   (или поменяйте значение ниже вручную). */
let TEST_GOLD = (() => {
  try {
    const search = (typeof window !== 'undefined' && window.location && window.location.search) || '';
    const m = /[?&]testgold=(\d+)/i.exec(search);
    return m ? Math.min(1e7, parseInt(m[1], 10) || 0) : 0;
  } catch (e) { return 0; }
})();

/* Скорость игры: ×0.5 … ×5 (клавиша F / кнопка ⏩ рядом с приоритетом цели) */
const SPEEDS = [0.5, 1, 1.5, 2, 3, 5];
function cycleSpeed() {
  if (!G) return;
  const i = SPEEDS.indexOf(G.speed || 1);
  G.speed = SPEEDS[(i + 1) % SPEEDS.length];
  UI.hudSpeed();
  UI.toast('Скорость игры ×' + G.speed);
  Sfx.tone(420 + G.speed * 70, 0.06, 'square', 0.05, 900);
}

/* Состав волны: тип -> число (boss = 1), для панели врагов */
function waveComp(w) {
  const q = buildWave(w, G.diff);
  const c = {};
  for (const s of q) c[s.t] = (c[s.t] || 0) + 1;
  if (w % 5 === 0) c.boss = 1;
  return c;
}

const TARGET_MODES = [
  { id: 0, name: 'БЛИЖНИЙ', icon: '◎' },
  { id: 1, name: 'КРЕПКИЙ', icon: '⬢' },
  { id: 2, name: 'СЛАБЫЙ',  icon: '◇' }
];

let G = null;      // состояние забега
let W = 0, H = 0, DPR = 1;
let canvas, ctx;

function newRun() {
  const diff = SAVE.diff || 0;
  const S = computeStats({});
  G = {
    state: 'build',          // build | wave | dead | paused
    diff,
    wave: 0,
    time: 0,
    runTime: 0,
    S,
    levels: {},              // внутризабежные улучшения id -> lv
    tower: {
      x: 0, y: 0, r: TOWER_R, hp: S.maxHp, maxHp: S.maxHp, shield: S.shield,
      angle: -Math.PI / 2, cd: 0, recoil: 0, hitFlash: 0, pulse: 0
    },
    enemies: [], bullets: [], eBullets: [], structs: [], parts: [],
    pickups: [], texts: [], arcs: [],
    inv: {},                 // купленные постройки, ждущие установки
    placing: null,
    shelf: [],
    rerollsLeft: S.rerolls,
    rerollsUsed: 0,
    targetMode: 0,
    strike: { cd: 0, aiming: false, x: 0, y: 0 },
    focus: null,
    orbitCd: 0,
    missileCd: 2,
    shockCd: 0,
    queue: [], spawnT: 0, waveCount: 0, waveKilled: 0, bossAlive: null,
    speed: 1,
    buildT: BUILD_TIME,
    shake: 0, flash: 0, flashColor: '#fff',
    stats: { kills: 0, coins: 0, dmg: 0, bosses: 0, structsBuilt: 0, waves: 0 },
    view: { cx: 0, cy: 0, scale: 0.6 },
    mouse: { x: 0, y: 0, wx: 0, wy: 0, down: false },
    over: null,
    slowmo: 1
  };
  SAVE.stats.runs++;
  recomputeStats(true);
  // кошелёк забега: стартовый грант + тестовый банк; в мета-кошелёк не попадает
  G.purse = S.startGold + TEST_GOLD;
  G.allowLeft = S.startGold;   // сколько из гранта ещё не потрачено (не переносится)
  G.testLeft = TEST_GOLD;      // тестовый банк (не переносится)
  G.banked = false;
  G.revives = S.revives || 0;      // лаборатория: «Второе дыхание»
  G.nextComp = waveComp(1);
  rollShelf(true);
  resize();
  return G;
}

/* ---------- ХАРАКТЕРИСТИКИ ---------- */
function recomputeStats(fullHeal) {
  const prevHp = G.tower.hp, prevMax = G.tower.maxHp, prevShield = G.tower.shield;
  const S = computeStats(G.levels);
  G.S = S;
  G.tower.maxHp = S.maxHp;
  if (fullHeal) { G.tower.hp = S.maxHp; G.tower.shield = S.shield; }
  else {
    // сохраняем процент прочности + добавляем разницу, если maxHp вырос
    const frac = prevMax > 0 ? prevHp / prevMax : 1;
    G.tower.hp = clamp(prevHp + Math.max(0, S.maxHp - prevMax) * frac + (S.maxHp > prevMax ? (S.maxHp - prevMax) * 0.5 : 0), 0, S.maxHp);
    G.tower.shield = prevShield;
  }
}

/* ---------- МОНЕТЫ ----------
   Во время забега вся экономика идёт через G.purse (кошелёк забега):
   стартовый грант и тестовый банк в мета-кошелёк (SAVE.coins) не попадают.
   В SAVE.coins уходит только добыча за вычетом потраченного (перенос)
   и награда за забег. */
function addCoins(n, notify) {
  n = Math.round(n);
  if (n <= 0) return;
  if (G && G.purse !== undefined) { G.purse += n; G.stats.coins += n; }
  else { SAVE.coins += n; markSave(); }
  if (notify !== false) UI.hudCoins();
}
function spendCoins(n) {
  n = Math.round(n);
  if (G && G.purse !== undefined) {
    if (G.purse < n) return false;
    let rest = n;
    const t = Math.min(G.testLeft, rest); G.testLeft -= t; rest -= t;   // сначала тестовый банк
    const a = Math.min(G.allowLeft, rest); G.allowLeft -= a; rest -= a; // затем стартовый грант
    G.purse -= n;                                                      // остаток — добыча
    UI.hudCoins();
    return true;
  }
  if (SAVE.coins < n) return false;
  SAVE.coins -= n;
  markSave();
  UI.hudCoins();
  return true;
}
/* Перенос непотраченной ДОБЫЧИ забега в мета-кошелёк:
   серебро забега конвертируется в золото улучшений 1:100;
   стартовый грант и тест-банк сгорают. */
function bankRunCoins() {
  if (!G || G.banked || G.purse === undefined) return 0;
  G.banked = true;
  const silver = Math.max(0, Math.round(G.purse - G.testLeft - G.allowLeft));
  const gold = Math.floor(silver / 100);
  G.transferSilver = silver;
  if (gold > 0) { SAVE.coins += gold; markSave(); flushSave(); }
  return gold;
}

/* Награда забега и рекорды: одинаковы при гибели башни и при выходе в меню */
function runReward() {
  const D = DIFFS[G.diff];
  return Math.round((6 + G.wave * 5.5 + G.stats.kills * 0.12 + G.stats.bosses * 18) * D.coins);
}
function bankRunProgress() {
  if (!G || G.rewarded) return 0;
  G.rewarded = true;
  const reward = runReward();
  if (G.diff === 3) YA.submitScore(G.wave);   // таблица лидеров: только рекорды со сложности «Ад»
  SAVE.coins += reward;
  SAVE.stats.waves += G.wave;
  SAVE.stats.time += G.runTime;
  if (G.wave > SAVE.best.wave) SAVE.best.wave = G.wave;
  if (G.stats.kills > SAVE.best.kills) SAVE.best.kills = G.stats.kills;
  if (reward > SAVE.best.coins) SAVE.best.coins = reward;
  // рекорд по каждой сложности отдельно: ими открываются следующие сложности
  const bd = SAVE.bestByDiff || (SAVE.bestByDiff = {});
  bd[G.diff] = Math.max(bd[G.diff] || 0, G.wave);
  markSave();
  return reward;
}

/* ---------- ЛАВКА ---------- */
function rollShelf(fresh) {
  if (!G.shelf) G.shelf = [];
  if (fresh) {
    // полностью новый ассортимент, без повторов
    G.shelf = [];
    const seen = {};
    let guard = 0;
    while (G.shelf.length < 5 && guard++ < 60) {
      const c = rollCard();
      if (!c || seen[c.id]) continue;
      seen[c.id] = 1;
      G.shelf.push(c);
    }
  } else {
    while (G.shelf.length < 5) {
      const c = rollCard();
      if (!c) break;          // всё выкуплено до максимума — полка может опустеть
      G.shelf.push(c);
    }
  }
  UI.renderShop();
}

function rollCard() {
  const avail = SHOP.filter(d => {
    if (d.kind === 'build') return false;   // постройки живут в отдельной секции лавки
    return (G.levels[d.id] || 0) < d.max;
  });
  if (!avail.length) return null;
  // вес по редкости
  const w = avail.map(d => ({ d, w: RARITY[d.rarity].w }));
  return { id: weightedPick(w).d.id, fresh: true };
}

function countStructs(key) {
  let n = G.inv[key] || 0;
  for (const s of G.structs) if (s.key === key) n++;
  return n;
}

function buyShelf(i) {
  if (G.state !== 'build' && G.state !== 'wave') return;   // в бою покупать можно
  const slot = G.shelf[i];
  if (!slot) return;
  const def = SHOP_BY_ID[slot.id];
  if (!def) return;
  const lv = G.levels[def.id] || 0;
  let price;
  if (def.kind === 'build') price = structCost(def.struct, G.S.priceMult);
  else price = shopCost(def, lv, G.wave, G.S.priceMult);

  if (def.kind === 'build' && countStructs(def.struct) >= STRUCTS[def.struct].max) {
    UI.toast('Больше таких построек ставить нельзя'); Sfx.deny(); return;
  }
  if (!spendCoins(price)) { Sfx.deny(); UI.toast('Не хватает монет'); return; }

  Sfx.buy();
  if (def.kind === 'build') {
    G.inv[def.struct] = (G.inv[def.struct] || 0) + 1;
    G.placing = def.struct;
    UI.toast(def.name + ' — выберите место на арене');
  } else if (def.kind === 'repair') {
    const heal = Math.round(G.tower.maxHp * 0.35);
    G.tower.hp = Math.min(G.tower.maxHp, G.tower.hp + heal);
    floatText(0, -60, '+' + heal + ' HP', '#7bd948', 20);
    Sfx.heal();
    burst(0, 0, 16, '#7bd948', 90);
  } else {
    G.levels[def.id] = lv + 1;
    recomputeStats(false);
    floatText(0, -60, def.name + ' ур.' + (lv + 1), RARITY[def.rarity].color, 18);
    burst(0, 0, 14, RARITY[def.rarity].color, 80);
  }
  G.shelf.splice(i, 1);
  UI.renderShop();
  UI.hudAll();
}

function rerollShelf() {
  if (G.state !== 'build' && G.state !== 'wave') return;
  if (G.rerollsLeft <= 0) { Sfx.deny(); UI.toast('Обновления закончились до следующей волны'); return; }
  G.rerollsLeft--;
  G.rerollsUsed++;
  // полностью новая полка: без дублей и без пустых слотов (rollCard может вернуть null)
  rollShelf(true);
  Sfx.tone(700, 0.08, 'triangle', 0.07, 1100);
}

/* ---------- ПОСТРОЙКИ ---------- */
function canPlaceAt(x, y) {
  const d = Math.hypot(x, y);
  if (d < TOWER_R + 34 || d > ARENA_R - 26) return false;
  for (const s of G.structs) if (dist(x, y, s.x, s.y) < s.r + 26) return false;
  return true;
}

function placeStruct(key, x, y) {
  if ((G.inv[key] || 0) <= 0) return false;
  if (!canPlaceAt(x, y)) return false;
  const def = STRUCTS[key];
  G.inv[key]--;
  const hpMul = G.S.turretMul;
  G.structs.push({
    key, x, y, r: def.r, def,
    hp: Math.round(def.hp * hpMul), maxHp: Math.round(def.hp * hpMul),
    cd: rand(0, 0.5), flash: 0, born: G.time, ang: rand(0, TAU), dead: false
  });
  if (G.inv[key] <= 0) G.placing = null;
  G.stats.structsBuilt++;
  Sfx.place();
  burst(x, y, 12, '#ffd23f', 70);
  ring(x, y, 30, '#ffd23f', 0.4);
  UI.renderShop();
  UI.hudAll();
  return true;
}

function damageStruct(s, dmg) {
  s.hp -= dmg;
  s.flash = 0.15;
  if (s.hp <= 0 && !s.dead) {
    s.dead = true;
    burst(s.x, s.y, 18, '#ffb066', 130);
    ring(s.x, s.y, 40, '#ff8844', 0.5);
    Sfx.smallBoom();
    if (s.key === 'mine') return;
  }
}

function mineExplode(s) {
  const def = STRUCTS.mine;
  const dmg = (def.dmgBase + G.S.dmg * def.dmgScale) * (1 + G.wave * 0.05);
  aoe(s.x, s.y, def.radius, dmg, '#ffb066');
  ring(s.x, s.y, def.radius, '#ffd23f', 0.45);
  burst(s.x, s.y, 26, '#ff9944', 190);
  shake(7);
  Sfx.boom();
  s.hp = 0; s.dead = true;
}

/* ---------- УРОН ---------- */
function aoe(x, y, r, dmg, color) {
  for (const e of G.enemies) {
    if (e.dead) continue;
    const d = dist(x, y, e.x, e.y);
    if (d < r + e.r) {
      const falloff = clamp(1 - (d - r * 0.35) / (r * 1.2), 0.45, 1);
      damageEnemy(e, dmg * falloff, null, color);
    }
  }
}

function damageEnemy(e, amount, bullet, color) {
  if (e.dead) return 0;
  let dmg = amount;
  if (e.armor) dmg = Math.max(dmg * 0.18, dmg - e.armor);
  if (e.shieldHp > 0) {
    const absorbed = Math.min(e.shieldHp, dmg);
    e.shieldHp -= absorbed;
    dmg -= absorbed;
    e.shieldT = e.shieldDelay;
    if (e.shieldHp <= 0) { ring(e.x, e.y, e.r + 12, '#ffc76b', 0.35); Sfx.shield(); }
    else if (chance(0.25)) spark(e.x, e.y, '#ffe6b0', 3);
  }
  if (dmg > 0) {
    e.hp -= dmg;
    e.flash = 0.1;
    G.stats.dmg += dmg;
    if (SAVE.dmgNumbers && (bullet && bullet.crit || dmg > e.maxHp * 0.22)) {
      floatText(e.x + rand(-6, 6), e.y - e.r - 4, Math.round(dmg), bullet && bullet.crit ? '#ffd23f' : '#ffffff', bullet && bullet.crit ? 17 : 12);
    }
    if (bullet && bullet.crit) spark(e.x, e.y, '#ffd23f', 6);
  }
  if (e.hp <= 0) killEnemy(e, bullet);
  return dmg;
}

function killEnemy(e, bullet) {
  if (e.dead) return;
  e.dead = true;
  G.waveKilled++;
  G.stats.kills++;
  SAVE.stats.kills++;
  markSave();

  const coinVal = Math.max(1, Math.round(e.gold * G.S.goldMult));
  dropCoins(e.x, e.y, coinVal, e.boss ? 6 : 1);
  if (chance(e.boss ? 1 : 0.022)) dropHeal(e.x, e.y);

  burst(e.x, e.y, e.boss ? 46 : Math.min(20, 6 + e.r), e.def.color, e.boss ? 230 : 120);
  ring(e.x, e.y, e.r * (e.boss ? 3.4 : 2.2), e.def.color, e.boss ? 0.7 : 0.35);
  if (e.boss) { shake(22); Sfx.boom(); Sfx.victory(); }
  else Sfx.kill();

  if (G.S.lifesteal > 0) healTower(G.S.lifesteal);

  // лаборатория: «Каскад детонаций» — смерть взрывает область (один скачок)
  if (G.S.cascade > 0 && !e._noCas) {
    const R = G.S.cascade, D = G.S.cascadeDmg * (1 + G.wave * 0.03);
    ring(e.x, e.y, R, '#c86bff', 0.35);
    burst(e.x, e.y, 10, '#c86bff', 120);
    for (const o of G.enemies) {
      if (o === e || o.dead) continue;
      if (dist(o.x, o.y, e.x, e.y) < R + o.r) { o._noCas = true; damageEnemy(o, D, null, '#c86bff'); }
    }
  }

  if (e.def.split && e.def.splitN) {
    for (let i = 0; i < e.def.splitN; i++) {
      const a = rand(0, TAU);
      spawnEnemy(e.def.split, e.x + Math.cos(a) * 14, e.y + Math.sin(a) * 14, a, true);
    }
  }
  if (e.boss) {
    G.stats.bosses++;
    SAVE.stats.bosses++;
    G.bossAlive = null;
    bossTrophy(e);
  }
}

/* Трофей с босса — бесплатное улучшение */
function bossTrophy(e) {
  const avail = SHOP.filter(d => !d.kind && (G.levels[d.id] || 0) < d.max);
  if (!avail.length) { addCoins(80); UI.toast('Трофей босса: +80 монет'); return; }
  const w = avail.map(d => ({ d, w: RARITY[d.rarity].w * (d.rarity === 'epic' ? 3 : 1) }));
  const def = weightedPick(w).d;
  // +2 «полуэтапа» = прежний полный этап: ценность трофея не изменилась
  G.levels[def.id] = Math.min(def.max, (G.levels[def.id] || 0) + 2);
  recomputeStats(false);
  addCoins(40);   // серебро трофея одинаково на всех сложностях
  UI.banner('ТРОФЕЙ БОССА', def.icon + ' ' + def.name + ' ур.' + G.levels[def.id], RARITY[def.rarity].color);
  Sfx.levelup();
  UI.renderShop();
}

function healTower(n) {
  if (G.tower.hp <= 0) return;
  const before = G.tower.hp;
  G.tower.hp = Math.min(G.tower.maxHp, G.tower.hp + n);
  if (G.tower.hp - before > 0.5 && chance(0.3)) floatText(rand(-20, 20), -34, '+' + Math.round(G.tower.hp - before), '#7bd948', 11);
}

function applyTowerDamage(amount, srcX, srcY) {
  if (G.state === 'dead') return;
  // процентное снижение (до брони), затем абсолютная броня с полом 20%
  const red = amount * (1 - clamp(G.S.dmgReduce || 0, 0, 0.75));
  let dmg = Math.max(red * 0.2, red - G.S.armor);
  const T = G.tower;
  if (T.shield > 0) {
    const ab = Math.min(T.shield, dmg);
    T.shield -= ab; dmg -= ab;
    ring(T.x, T.y, T.r + 14, '#59c8ff', 0.3);
  }
  if (dmg <= 0) return;
  T.hp -= dmg;
  T.hitFlash = 0.25;
  G.flash = Math.min(0.55, 0.18 + dmg / 90);
  G.flashColor = '#ff4455';
  shake(Math.min(16, 4 + dmg * 0.35));
  Sfx.hurt();
  floatText(rand(-16, 16), -T.r - 8, '-' + Math.round(dmg), '#ff6b7a', 15);
  if (srcX !== undefined) burst(srcX, srcY, 8, '#ff6b7a', 90);
  if (T.hp <= 0) {
    if ((G.revives || 0) > 0) {           // лаборатория: «Второе дыхание»
      G.revives--;
      T.hp = Math.round(T.maxHp * 0.5);
      burst(T.x, T.y, 40, '#7bd948', 220);
      ring(T.x, T.y, 160, '#7bd948', 0.8);
      shake(18);
      Sfx.levelup();
      UI.banner('ВТОРОЕ ДЫХАНИЕ', 'башня восстановлена до 50%', '#7bd948');
      floatText(0, -T.r - 24, 'РЕАНИМАЦИЯ', '#7bd948', 20);
    } else {
      T.hp = 0; gameOver();
    }
  }
  UI.hudHp();
}

/* ---------- ВРАГИ ---------- */
function spawnEnemy(type, x, y, ang, isSplit) {
  const def = ENEMIES[type];
  if (!def) return null;
  const sc = enemyScale(G.wave, G.diff);
  const hpMul = isSplit ? 0.6 : 1;
  const hp = Math.round(def.hp * sc.hp * hpMul);
  const e = {
    type, def, x, y, r: def.r,
    hp, maxHp: hp,
    speed: def.speed * sc.speed * rand(0.92, 1.08),
    atk: def.atk * sc.dmg,
    gold: def.gold * sc.gold,
    armor: def.armor || 0,
    shieldHp: def.shield ? def.shield * sc.hp * 0.8 : 0,
    shieldMax: def.shield ? def.shield * sc.hp * 0.8 : 0,
    shieldT: 0, shieldDelay: def.shieldDelay || 3, shieldRegen: def.shieldRegen || 0,
    flash: 0, slowT: 0, slowAmt: 0, fieldSlow: 0, healAcc: 0,
    burnT: 0, burnDps: 0,
    atkCd: rand(0, 0.5), cd: rand(0.5, 2),
    ang: ang === undefined ? Math.atan2(-y, -x) : ang,
    wob: rand(0, TAU), dead: false, boss: false,
    zigT: rand(0, 2), zigDir: chance(0.5) ? 1 : -1,
    spawnT: isSplit ? 0 : 0.45
  };
  if (isSplit && G && G.state === 'wave') {
    G.waveCount = (G.waveCount || 0) + 1;  // осколки/призыв тоже входят в счётчик волны
    if (G.waveTimedOut) e.flee = true;     // после лимита времени новые враги сразу отступают
  }
  G.enemies.push(e);
  return e;
}

function spawnBoss(type) {
  const def = BOSSES[type];
  const sc = enemyScale(G.wave, G.diff);
  const bossWaveMul = 1 + Math.max(0, (G.wave / 5 - 1)) * 0.5;
  const hp = Math.round(def.hp * sc.hp * 0.44 * bossWaveMul);
  const a = rand(0, TAU);
  const e = {
    type, def, x: Math.cos(a) * SPAWN_R, y: Math.sin(a) * SPAWN_R, r: def.r,
    hp, maxHp: hp, speed: def.speed * sc.speed, atk: def.atk * sc.dmg,
    gold: def.gold * sc.gold, armor: def.armor || 0,
    shieldHp: 0, shieldMax: 0, shieldT: 0, shieldDelay: 3, shieldRegen: 0,
    flash: 0, slowT: 0, slowAmt: 0, fieldSlow: 0, healAcc: 0, burnT: 0, burnDps: 0,
    atkCd: 0, cd: 2, ang: a + Math.PI, wob: rand(0, TAU), dead: false, boss: true,
    chargeT: 0, chargeCd: def.chargeCd || 4, chargeDir: 0, stompCd: 3,
    spawnT: 0, zigT: 0, zigDir: 1, spawnT0: 0
  };
  e.spawnT = 1.0;
  G.enemies.push(e);
  G.bossAlive = e;
  UI.showBoss(e);
  Sfx.bossWarn();
  UI.banner('⚠ БОСС ⚠', def.name, def.color);
  return e;
}

function updateEnemies(dt) {
  const T = G.tower;
  const list = G.enemies;
  for (let i = list.length - 1; i >= 0; i--) {
    const e = list[i];
    if (e.dead) { list.splice(i, 1); continue; }
    if (e.flee) {   // отступление по лимиту волны: бегут от башни и покидают арену
      const fdx = e.x - T.x, fdy = e.y - T.y;
      const fd = Math.hypot(fdx, fdy) || 1;
      e.x += fdx / fd * e.speed * 1.7 * dt;
      e.y += fdy / fd * e.speed * 1.7 * dt;
      e.ang = Math.atan2(fdy, fdx);
      if (fd > SPAWN_R + 80) { e.dead = true; list.splice(i, 1); }
      continue;
    }
    if (e.spawnT > 0) { e.spawnT -= dt; }

    // эффекты
    if (e.flash > 0) e.flash -= dt;
    if (e.healAcc > 0) e.healAcc = Math.max(0, e.healAcc - e.maxHp * HEAL_CAP * dt);   // «остывание» полученного лечения
    if (e.burnT > 0) {
      e.burnT -= dt;
      damageEnemy(e, e.burnDps * dt, null);
      if (chance(dt * 8)) spark(e.x + rand(-e.r, e.r), e.y + rand(-e.r, e.r), '#ff8844', 1);
      if (e.dead) { list.splice(i, 1); continue; }
    }
    if (e.slowT > 0) e.slowT -= dt;
    if (e.shieldMax > 0) {
      if (e.shieldT > 0) e.shieldT -= dt;
      else e.shieldHp = Math.min(e.shieldMax, e.shieldHp + e.shieldRegen * dt);
    }

    const slow = 1 - clamp(Math.max(e.slowT > 0 ? e.slowAmt : 0, e.fieldSlow), 0, 0.85);
    e.fieldSlow = 0;
    const spd = e.speed * slow * (e.spawnT > 0 ? 0.35 : 1);

    const dx = T.x - e.x, dy = T.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    const nx = dx / d, ny = dy / d;
    e.wob += dt * 6;

    if (e.boss) { updateBoss(e, dt, nx, ny, d, spd); }
    else if (e.def.ai === 'ranged') {
      const pref = e.def.pref || 240;
      if (d > pref + 12) { e.x += nx * spd * dt; e.y += ny * spd * dt; }
      else if (d < pref - 40) { e.x -= nx * spd * dt * 0.6; e.y -= ny * spd * dt * 0.6; }
      else { e.x += -ny * spd * dt * 0.25 * (e.wob % 2 < 1 ? 1 : -1); e.y += nx * spd * dt * 0.25 * (e.wob % 2 < 1 ? 1 : -1); }
      e.cd -= dt;
      if (e.cd <= 0 && d < pref + 90) {
        e.cd = e.def.cd;
        if (e.def.summon) {
          const a = rand(0, TAU);
          spawnEnemy(e.def.summon, e.x + Math.cos(a) * 22, e.y + Math.sin(a) * 22, a, true);
          ring(e.x, e.y, 30, e.def.color, 0.4);
          Sfx.tone(400, 0.15, 'sine', 0.06, 700);
        } else if (e.def.heal) {
          // Знахарь лечит ОДНОГО самого побитого союзника в радиусе, а не всех
          // разом; входящее лечение на цель ограничено (см. HEAL_CAP и затухание
          // healAcc в updateEnemies). Иначе толпа знахарей лечит друг друга
          // быстрее, чем башня снимает HP — волну невозможно закончить.
          let target = null, worst = 1;
          for (const o of G.enemies) {
            if (o === e || o.dead || o.hp >= o.maxHp) continue;
            if (dist(o.x, o.y, e.x, e.y) >= e.def.healR) continue;
            const frac = o.hp / o.maxHp;
            if (frac < worst) { worst = frac; target = o; }
          }
          if (target) {
            const want = e.def.heal * enemyScale(G.wave, G.diff).hp;
            const room = target.maxHp * HEAL_CAP - (target.healAcc || 0);
            const h = Math.min(want, Math.max(0, room));
            if (h > 0.01) {
              target.hp = Math.min(target.maxHp, target.hp + h);
              target.healAcc = (target.healAcc || 0) + h;
            }
            spark(target.x, target.y, '#9dff8a', 3);
            ring(target.x, target.y, target.r + 12, '#9dff8a', 0.35);
          }
        } else {
          enemyShoot(e, nx, ny);
        }
      }
      e.ang = Math.atan2(ny, nx);
    } else if (e.def.ai === 'suicide') {
      e.x += nx * spd * dt; e.y += ny * spd * dt;
      if (d < T.r + e.r + 4) {
        const boom = e.def.boom * enemyScale(G.wave, G.diff).dmg;
        ring(e.x, e.y, e.def.boom, '#ff6b3d', 0.5);
        burst(e.x, e.y, 24, '#ff9944', 180);
        shake(12); Sfx.boom();
        if (dist(e.x, e.y, T.x, T.y) < e.def.boom + T.r) applyTowerDamage(boom, e.x, e.y);
        for (const s of G.structs) if (!s.dead && dist(e.x, e.y, s.x, s.y) < e.def.boom + s.r) damageStruct(s, boom * 1.5);
        dropCoins(e.x, e.y, Math.max(1, Math.round(e.gold * G.S.goldMult)), 1);
        e.dead = true; G.waveKilled++; G.stats.kills++; SAVE.stats.kills++; markSave();
        list.splice(i, 1); continue;
      }
      if (chance(dt * 12)) spark(e.x + rand(-4, 4), e.y + rand(-4, 4), '#ff6b3d', 1);
      e.ang = Math.atan2(ny, nx);
    } else {
      // ближний бой: идёт к башне, но может быть заблокирован постройкой
      let blocked = null;
      if (!e.def.fly) {
        for (const s of G.structs) {
          if (s.dead || s.key === 'mine' || s.key === 'cryo') continue;
          if (dist(e.x, e.y, s.x, s.y) < s.r + e.r + 2) { blocked = s; break; }
        }
      }
      // крио-поля замедляют
      if (!e.def.fly) {
        for (const s of G.structs) {
          if (s.dead || s.key !== 'cryo') continue;
          if (dist(e.x, e.y, s.x, s.y) < s.def.range + e.r) e.fieldSlow = Math.max(e.fieldSlow, s.def.slow);
        }
      }
      if (blocked) {
        e.atkCd -= dt;
        if (e.atkCd <= 0) {
          e.atkCd = 1.05;
          damageStruct(blocked, e.atk);
          spark(blocked.x, blocked.y, '#ffd23f', 4);
          if (blocked.hp <= 0) { blocked = null; }
        }
        e.ang = Math.atan2(blocked ? blocked.y - e.y : ny, blocked ? blocked.x - e.x : nx);
      } else if (d > T.r + e.r - 2) {
        let mx = nx, my = ny;
        if (e.def.zig) {
          e.zigT -= dt;
          if (e.zigT <= 0) { e.zigT = rand(0.5, 1.2); e.zigDir *= -1; }
          const p = -ny * e.zigDir * 0.55, q = nx * e.zigDir * 0.55;
          mx = nx + p; my = ny + q;
          const l = Math.hypot(mx, my) || 1; mx /= l; my /= l;
        }
        e.x += mx * spd * dt; e.y += my * spd * dt;
        e.ang = Math.atan2(my, mx);
      } else {
        e.atkCd -= dt;
        if (e.atkCd <= 0) {
          e.atkCd = 1.05;
          applyTowerDamage(e.atk, e.x, e.y);
          spark(e.x, e.y, '#ff6b7a', 5);
        }
        e.ang = Math.atan2(ny, nx);
      }
    }

    // мины
    if (!e.def.fly) {
      for (const s of G.structs) {
        if (s.dead || s.key !== 'mine') continue;
        if (dist(e.x, e.y, s.x, s.y) < s.def.trigR + e.r * 0.6) { mineExplode(s); break; }
      }
    }

    // расталкивание
    for (let j = i - 1; j >= 0; j--) {
      const o = list[j];
      if (o.dead) continue;
      if (!!o.def.fly !== !!e.def.fly) continue;
      const ddx = e.x - o.x, ddy = e.y - o.y;
      const dd = Math.hypot(ddx, ddy);
      const minD = (e.r + o.r) * 0.86;
      if (dd > 0.001 && dd < minD) {
        const push = (minD - dd) * 0.5;
        const px = ddx / dd * push, py = ddy / dd * push;
        const wO = o.boss ? 0.1 : 1, wE = e.boss ? 0.1 : 1;
        e.x += px * wO; e.y += py * wO;
        o.x -= px * wE; o.y -= py * wE;
      }
    }

    // не пускаем внутрь башни (иначе их не достать снарядами)
    const dT = Math.hypot(e.x - T.x, e.y - T.y);
    const minD = T.r + e.r * 0.8;
    if (dT < minD && dT > 0.0001) {
      e.x = T.x + (e.x - T.x) / dT * minD;
      e.y = T.y + (e.y - T.y) / dT * minD;
    }
    // не выпускаем за арену
    const cd2 = Math.hypot(e.x, e.y);
    const maxD = e.def.fly ? SPAWN_R + 40 : SPAWN_R + 40;
    if (cd2 > maxD) { e.x *= maxD / cd2; e.y *= maxD / cd2; }
  }
}

function enemyShoot(e, nx, ny) {
  const sc = enemyScale(G.wave, G.diff);
  const dmg = (e.def.atk || 6) * sc.dmg * 1.1;
  const speed = 210;
  const mk = (ang) => G.eBullets.push({
    x: e.x + Math.cos(ang) * (e.r + 4), y: e.y + Math.sin(ang) * (e.r + 4),
    vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, r: 6, dmg, life: 4, color: e.def.color
  });
  mk(Math.atan2(ny, nx));
  Sfx.tone(320, 0.1, 'sawtooth', 0.05, 160);
}

function updateBoss(e, dt, nx, ny, d, spd) {
  const def = e.def;
  if (def.chargeCd) {
    e.chargeCd -= dt;
    if (e.chargeT > 0) {
      e.chargeT -= dt;
      e.x += Math.cos(e.chargeDir) * spd * 5.2 * dt;
      e.y += Math.sin(e.chargeDir) * spd * 5.2 * dt;
      if (chance(dt * 30)) spark(e.x + rand(-20, 20), e.y + rand(-20, 20), def.color, 2);
      if (e.chargeT <= 0) {
        // ударная волна в конце рывка
        ring(e.x, e.y, def.stomp.radius, '#ff5566', 0.5);
        shake(14); Sfx.boom();
        if (dist(e.x, e.y, G.tower.x, G.tower.y) < def.stomp.radius + G.tower.r) applyTowerDamage(def.stomp.dmg * enemyScale(G.wave, G.diff).dmg, e.x, e.y);
        for (const s of G.structs) if (!s.dead && dist(e.x, e.y, s.x, s.y) < def.stomp.radius + s.r) damageStruct(s, def.stomp.dmg * 2);
      }
    } else if (e.chargeCd <= 0 && d < 420) {
      e.chargeCd = def.chargeCd * rand(0.85, 1.2);
      e.chargeT = 0.75;
      e.chargeDir = Math.atan2(ny, nx);
      UI.toast2('Крушитель готовится к рывку!');
      Sfx.tone(120, 0.5, 'sawtooth', 0.1, 300);
    }
  }
  if (def.summon) {
    e.spawnT0 = (e.spawnT0 || 0) - dt;
    if (e.spawnT0 <= 0) {
      e.spawnT0 = def.summonCd;
      const n = def.summonN || 1;
      for (let i = 0; i < n; i++) {
        const a = rand(0, TAU);
        spawnEnemy(def.summon, e.x + Math.cos(a) * (e.r + 10), e.y + Math.sin(a) * (e.r + 10), a, true);
      }
      ring(e.x, e.y, e.r + 26, def.color, 0.45);
      Sfx.tone(300, 0.2, 'sine', 0.07, 520);
    }
  }
  if (def.ranged) {
    const pref = def.pref;
    if (d > pref + 20) { e.x += nx * spd * dt; e.y += ny * spd * dt; }
    else if (d < pref - 60) { e.x -= nx * spd * dt * 0.7; e.y -= ny * spd * dt * 0.7; }
    else { const a = Math.atan2(ny, nx) + Math.PI / 2; e.x += Math.cos(a) * spd * dt * 0.5; e.y += Math.sin(a) * spd * dt * 0.5; }
    e.cd -= dt;
    if (e.cd <= 0) {
      e.cd = def.cd;
      const base = Math.atan2(ny, nx);
      const sc = enemyScale(G.wave, G.diff);
      for (let i = 0; i < def.spread; i++) {
        const a = base + (i - (def.spread - 1) / 2) * 0.22;
        G.eBullets.push({
          x: e.x + Math.cos(a) * e.r, y: e.y + Math.sin(a) * e.r,
          vx: Math.cos(a) * 230, vy: Math.sin(a) * 230, r: 7,
          dmg: def.boltDmg * sc.dmg, life: 4.5, color: '#9fe8ff'
        });
      }
      Sfx.tone(500, 0.14, 'square', 0.06, 200);
    }
  } else {
    // обычный подход к башне
    let blocked = null;
    if (!def.fly) {
      for (const s of G.structs) {
        if (s.dead || s.key === 'mine' || s.key === 'cryo') continue;
        if (dist(e.x, e.y, s.x, s.y) < s.r + e.r + 2) { blocked = s; break; }
      }
    }
    if (blocked) {
      e.atkCd -= dt;
      if (e.atkCd <= 0) { e.atkCd = def.atkCd || 1.5; damageStruct(blocked, e.atk); spark(blocked.x, blocked.y, '#ffd23f', 5); }
    } else if (d > G.tower.r + e.r - 2) {
      e.x += nx * spd * dt; e.y += ny * spd * dt;
    } else {
      e.atkCd -= dt;
      if (e.atkCd <= 0) { e.atkCd = def.atkCd || 1.5; applyTowerDamage(e.atk, e.x, e.y); }
    }
  }
  e.ang = Math.atan2(ny, nx);
}

/* ---------- СНАРЯДЫ БАШНИ ---------- */
function fireTower() {
  const S = G.S, T = G.tower;
  const target = acquireTarget();
  if (!target) return false;
  const baseAng = Math.atan2(target.y - T.y, target.x - T.x);
  T.angle = baseAng;
  const n = Math.max(1, Math.round(S.projectiles));
  const spread = n === 1 ? 0 : 0.115;
  for (let i = 0; i < n; i++) {
    const off = (i - (n - 1) / 2) * spread + rand(-0.02, 0.02);
    const a = baseAng + off;
    const crit = chance(S.crit);
    let dmg = S.dmg * (crit ? S.critMult : 1);
    if (S.fury > 0 && T.hp < T.maxHp * 0.5) dmg *= 1 + S.fury;   // лаборатория: «Ярость ядра»
    const muzzle = T.r * 0.45;
    G.bullets.push({
      x: T.x + Math.cos(a) * muzzle, y: T.y + Math.sin(a) * muzzle,
      vx: Math.cos(a) * S.projSpeed, vy: Math.sin(a) * S.projSpeed,
      r: crit ? 6 : 4.6, dmg, crit, pierce: S.pierce, hit: [], rico: S.ricochet,
      life: (S.range + 120) / S.projSpeed, ang: a, kind: 'shot',
      color: crit ? '#ffd23f' : '#8ff0ff'
    });
  }
  T.recoil = 1;
  T.pulse = 1;
  spark(T.x + Math.cos(baseAng) * (T.r + 14), T.y + Math.sin(baseAng) * (T.r + 14), '#bff4ff', 3);
  if (S.dmg > 40) Sfx.shootHeavy(); else Sfx.shoot();
  return true;
}

function acquireTarget() {
  const S = G.S, T = G.tower;
  const R = S.range;
  if (G.focus && !G.focus.dead) {
    if (dist(G.focus.x, G.focus.y, T.x, T.y) <= R + G.focus.r) return G.focus;
  } else if (G.focus) G.focus = null;
  let best = null, bestVal = null;
  for (const e of G.enemies) {
    if (e.dead || e.spawnT > 0.2) continue;
    const d = dist(e.x, e.y, T.x, T.y);
    if (d > R + e.r) continue;
    let v;
    if (G.targetMode === 0) v = d;
    else if (G.targetMode === 1) v = -(e.hp + (e.shieldHp || 0) + (e.boss ? 1e6 : 0));
    else v = e.hp + (e.shieldHp || 0) - (e.boss ? 1e6 : 0);
    if (bestVal === null || v < bestVal) { bestVal = v; best = e; }
  }
  return best;
}

function updateBullets(dt) {
  const S = G.S;
  for (let i = G.bullets.length - 1; i >= 0; i--) {
    const b = G.bullets[i];
    if (b.kind === 'missile' && b.target && !b.target.dead) {
      const a = Math.atan2(b.target.y - b.y, b.target.x - b.x);
      const cur = Math.atan2(b.vy, b.vx);
      let da = a - cur;
      while (da > Math.PI) da -= TAU;
      while (da < -Math.PI) da += TAU;
      const na = cur + clamp(da, -6 * dt, 6 * dt);
      const sp = Math.hypot(b.vx, b.vy) + 260 * dt;
      b.vx = Math.cos(na) * Math.min(sp, 620);
      b.vy = Math.sin(na) * Math.min(sp, 620);
      b.ang = na;
    }
    b.life -= dt;
    if (chance(dt * 22)) spark(b.x, b.y, b.color, 1, 22);

    let exploded = false;
    // движение подшагами: быстрый снаряд не пролетает сквозь врага
    const stepLen = Math.hypot(b.vx, b.vy) * dt;
    const sub = clamp(Math.ceil(stepLen / 9), 1, 8);
    for (let q = 0; q < sub && !exploded; q++) {
      b.x += b.vx * dt / sub; b.y += b.vy * dt / sub;
      exploded = bulletCollide(b, S);
    }
    if (exploded || b.life <= 0 || Math.hypot(b.x, b.y) > SPAWN_R + 90) {
      if (!exploded && S.split > 0 && b.kind === 'shot') splitBullet(b);
      else if (!exploded && b.kind === 'shot') spark(b.x, b.y, b.color, 3, 40);
      G.bullets.splice(i, 1);
    }
  }
}

/* Проверка попадания одного снаряда (один подшаг). Возвращает true, если снаряд исчез. */
function bulletCollide(b, S) {
  {
    for (const e of G.enemies) {
      if (e.dead || e.spawnT > 0.25) continue;
      if (b.hit.indexOf(e) >= 0) continue;
      if (dist(b.x, b.y, e.x, e.y) < e.r + b.r) {
        b.hit.push(e);
        damageEnemy(e, b.dmg, b, b.color);
        applyOnHit(e, b);
        if (b.kind === 'missile') {
          aoe(b.x, b.y, 62, b.dmg * 0.7, '#ffb066');
          ring(b.x, b.y, 62, '#ffb066', 0.35);
          burst(b.x, b.y, 14, '#ff9944', 130);
          Sfx.smallBoom(); shake(3);
          return true;
        }
        if (S.explode > 0) {
          aoe(b.x, b.y, S.explode, b.dmg * S.explodeMul, '#ffb066');
          ring(b.x, b.y, S.explode, '#ff9944', 0.3);
          burst(b.x, b.y, 10, '#ff9944', 120);
          Sfx.smallBoom();
          return true;
        }
        Sfx.hit();
        // рикошет
        if (b.rico > 0) {
          const nxt = nearestEnemyExcept(b.x, b.y, b.hit, 300);
          if (nxt) {
            b.rico--;
            const a = Math.atan2(nxt.y - b.y, nxt.x - b.x);
            const sp = Math.hypot(b.vx, b.vy);
            b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp; b.ang = a;
            b.life = Math.max(b.life, 0.6);
            spark(b.x, b.y, '#bff4ff', 4);
            continue;
          }
        }
        if (b.pierce > 0) { b.pierce--; b.dmg *= 0.92; }
        else return true;
        break;
      }
    }
  }
  return false;
}

function applyOnHit(e, b) {
  const S = G.S;
  if (S.knock > 0 && !e.boss) {
    const a = b.ang;
    e.x += Math.cos(a) * S.knock * 0.07;
    e.y += Math.sin(a) * S.knock * 0.07;
  }
  if (S.slow > 0) { e.slowT = Math.max(e.slowT, S.slowDur); e.slowAmt = Math.max(e.slowAmt, S.slow); }
  if (S.burn > 0) { e.burnT = Math.max(e.burnT, S.burnDur); e.burnDps = Math.max(e.burnDps, S.burn * (1 + G.S.dmg / 40)); }
  if (S.chain > 0) chainLightning(e, b.dmg * 0.6, S.chain, b);
}

function chainLightning(from, dmg, jumps, b) {
  let cur = from;
  const used = b && b.hit ? b.hit.slice() : [from];
  for (let j = 0; j < jumps; j++) {
    const nxt = nearestEnemyExcept(cur.x, cur.y, used, G.S.chainRange);
    if (!nxt) break;
    used.push(nxt);
    G.arcs.push({ x1: cur.x, y1: cur.y, x2: nxt.x, y2: nxt.y, life: 0.18, max: 0.18 });
    damageEnemy(nxt, dmg, null, '#9fe8ff');
    spark(nxt.x, nxt.y, '#9fe8ff', 4);
    cur = nxt;
    dmg *= 0.75;
  }
  if (jumps > 0) Sfx.tone(1200, 0.07, 'square', 0.045, 400);
}

function nearestEnemyExcept(x, y, exclude, maxR) {
  let best = null, bd = maxR * maxR;
  for (const e of G.enemies) {
    if (e.dead || exclude.indexOf(e) >= 0) continue;
    const d = dist2(x, y, e.x, e.y);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

function splitBullet(b) {
  const S = G.S;
  const n = S.split;
  const base = Math.atan2(b.vy, b.vx) + Math.PI;
  for (let i = 0; i < n; i++) {
    const a = base + (i - (n - 1) / 2) * 0.85 + rand(-0.15, 0.15);
    G.bullets.push({
      x: b.x, y: b.y, vx: Math.cos(a) * S.projSpeed * 0.62, vy: Math.sin(a) * S.projSpeed * 0.62,
      r: 3.2, dmg: b.dmg * S.splitMul, crit: false, pierce: 0, hit: [], rico: 0,
      life: 0.55, ang: a, kind: 'shard', color: '#c9a6ff'
    });
  }
  spark(b.x, b.y, '#c9a6ff', 6, 70);
  Sfx.tone(900, 0.06, 'triangle', 0.04, 400);
}

function updateEBullets(dt) {
  const T = G.tower;
  for (let i = G.eBullets.length - 1; i >= 0; i--) {
    const b = G.eBullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (chance(dt * 10)) spark(b.x, b.y, b.color, 1, 18);
    let gone = b.life <= 0 || Math.hypot(b.x, b.y) > SPAWN_R + 60;
    if (!gone && dist(b.x, b.y, T.x, T.y) < T.r + b.r) {
      applyTowerDamage(b.dmg, b.x, b.y);
      gone = true;
    }
    if (!gone) {
      for (const s of G.structs) {
        if (s.dead || s.key === 'mine' || s.key === 'cryo') continue;
        if (dist(b.x, b.y, s.x, s.y) < s.r + b.r) { damageStruct(s, b.dmg); spark(b.x, b.y, b.color, 3); gone = true; break; }
      }
    }
    if (gone) G.eBullets.splice(i, 1);
  }
}

/* ---------- СПЕЦ-СИСТЕМЫ БАШНИ ---------- */
function updateTowerSystems(dt) {
  const S = G.S, T = G.tower;
  T.cd -= dt;
  if (T.recoil > 0) T.recoil = Math.max(0, T.recoil - dt * 6);
  if (T.hitFlash > 0) T.hitFlash -= dt;
  if (S.regen > 0) healTower(S.regen * dt);

  if (G.state === 'wave' || G.enemies.length) {
    if (T.cd <= 0) {
      if (fireTower()) T.cd = 1 / S.fireRate;
      else T.cd = 0.08;
    }
  }
  // плавный доворот башни к цели
  const tgt = acquireTarget();
  if (tgt) {
    const want = Math.atan2(tgt.y - T.y, tgt.x - T.x);
    let da = want - T.angle;
    while (da > Math.PI) da -= TAU;
    while (da < -Math.PI) da += TAU;
    T.angle += clamp(da, -9 * dt, 9 * dt);
  }

  // ауры
  if (S.slowAura > 0 || S.burnAura > 0) {
    for (const e of G.enemies) {
      if (e.dead) continue;
      if (dist(e.x, e.y, T.x, T.y) < S.auraRadius + e.r) {
        if (S.slowAura > 0) { e.fieldSlow = Math.max(e.fieldSlow, S.slowAura); }
        if (S.burnAura > 0) { e.burnT = Math.max(e.burnT, 0.35); e.burnDps = Math.max(e.burnDps, S.burnAura); }
      }
    }
  }
  // орбитальные клинки
  if (S.orbitals > 0) {
    G.orbitCd += dt * S.orbitalSpeed;
    for (let i = 0; i < S.orbitals; i++) {
      const a = G.orbitCd + (i / S.orbitals) * TAU;
      const ox = T.x + Math.cos(a) * S.orbitalRadius, oy = T.y + Math.sin(a) * S.orbitalRadius;
      for (const e of G.enemies) {
        if (e.dead || e.orbCd > 0) continue;
        if (dist(e.x, e.y, ox, oy) < e.r + 12) {
          e.orbCd = 0.45;
          damageEnemy(e, S.orbitalDmg * (1 + G.wave * 0.03), null, '#bff4ff');
          spark(ox, oy, '#bff4ff', 5);
          Sfx.tone(760, 0.05, 'triangle', 0.04, 420);
        }
      }
    }
  }
  for (const e of G.enemies) if (e.orbCd > 0) e.orbCd -= dt;

  // ракеты
  if (S.missiles > 0) {
    G.missileCd -= dt;
    if (G.missileCd <= 0 && G.enemies.length) {
      const t = acquireTarget() || G.enemies[0];
      if (t) {
        G.missileCd = S.missileCd;
        for (let i = 0; i < S.missiles; i++) {
          const a = rand(0, TAU);
          G.bullets.push({
            x: T.x + Math.cos(a) * 18, y: T.y + Math.sin(a) * 18,
            vx: Math.cos(a) * 160, vy: Math.sin(a) * 160, r: 5.5,
            dmg: S.missileDmg * (1 + G.wave * 0.04), crit: false, pierce: 0, hit: [], rico: 0,
            life: 3.2, ang: a, kind: 'missile', color: '#ffb066', target: t
          });
        }
        Sfx.tone(420, 0.18, 'sawtooth', 0.06, 900);
      }
    }
  }
  // импульс-волна
  if (S.shockCd > 0) {
    G.shockCd -= dt;
    if (G.shockCd <= 0) {
      G.shockCd = S.shockCd;
      let hitAny = false;
      for (const e of G.enemies) {
        if (e.dead) continue;
        if (dist(e.x, e.y, T.x, T.y) < S.shockRadius + e.r) {
          damageEnemy(e, S.shockDmg * (1 + G.wave * 0.04), null, '#9fe8ff');
          if (!e.boss && S.knock >= 0) {
            const a = Math.atan2(e.y - T.y, e.x - T.x);
            e.x += Math.cos(a) * 16; e.y += Math.sin(a) * 16;
          }
          hitAny = true;
        }
      }
      ring(T.x, T.y, S.shockRadius, '#9fe8ff', 0.45);
      if (hitAny) { Sfx.tone(220, 0.2, 'sine', 0.09, 900); shake(4); }
    }
  }
  // орбитальный удар
  if (G.strike.cd > 0) G.strike.cd -= dt;
}

/* ---------- ПОСТРОЙКИ ---------- */
function updateStructs(dt) {
  const S = G.S;
  for (let i = G.structs.length - 1; i >= 0; i--) {
    const s = G.structs[i];
    if (s.flash > 0) s.flash -= dt;
    if (s.dead || s.hp <= 0) {
      if (s.key !== 'mine') { burst(s.x, s.y, 12, '#99a', 90); }
      G.structs.splice(i, 1);
      UI.renderInv();
      continue;
    }
    if (s.key === 'turret') {
      s.cd -= dt;
      if (s.cd <= 0) {
        let best = null, bd = s.def.range * s.def.range;
        for (const e of G.enemies) {
          if (e.dead || e.spawnT > 0.25) continue;
          const d = dist2(s.x, s.y, e.x, e.y);
          if (d < bd) { bd = d; best = e; }
        }
        if (best) {
          s.cd = 1 / (s.def.fireRate * (1 + 0.04 * G.wave));
          const a = Math.atan2(best.y - s.y, best.x - s.x);
          s.ang = a;
          const dmg = (s.def.dmgBase + S.dmg * s.def.dmgScale) * S.turretMul * (1 + G.wave * 0.05);
          G.bullets.push({
            x: s.x + Math.cos(a) * (s.r + 4), y: s.y + Math.sin(a) * (s.r + 4),
            vx: Math.cos(a) * 430, vy: Math.sin(a) * 430, r: 3.6, dmg,
            crit: false, pierce: 0, hit: [], rico: 0, life: s.def.range / 430 + 0.1,
            ang: a, kind: 'turret', color: '#ffd23f'
          });
          spark(s.x + Math.cos(a) * (s.r + 6), s.y + Math.sin(a) * (s.r + 6), '#ffd23f', 2);
          Sfx.tone(rand(600, 700), 0.04, 'square', 0.028, 260);
        } else s.cd = 0.15;
      }
    }
  }
}

/* ---------- ПИКАПЫ ---------- */
function dropCoins(x, y, total, blobs) {
  const per = total / blobs;
  for (let i = 0; i < blobs; i++) {
    const a = rand(0, TAU), sp = rand(20, 90);
    G.pickups.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      val: Math.max(1, Math.round(per)), t: 0, kind: 'coin', r: 6, spin: rand(0, TAU)
    });
  }
}
function dropHeal(x, y) {
  G.pickups.push({ x, y, vx: rand(-40, 40), vy: rand(-40, 40), val: Math.max(4, Math.round(G.tower.maxHp * 0.07)), t: 0, kind: 'heal', r: 9, spin: 0 });
}

function updatePickups(dt) {
  const T = G.tower, mag = G.S.magnet;
  for (let i = G.pickups.length - 1; i >= 0; i--) {
    const p = G.pickups[i];
    p.t += dt; p.spin += dt * 6;
    const d = dist(p.x, p.y, T.x, T.y);
    if (p.t > 0.3) {
      const a = Math.atan2(T.y - p.y, T.x - p.x);
      const near = d < mag;
