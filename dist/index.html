/* ---------- цены ремонта и покупок ---------- */
/* Полная сумма, вложенная в постоянные улучшения (для возврата при сбросе) */
function metaRefundTotal() {
  let total = 0;
  for (const m of META) {
    const lv = SAVE.meta[m.id] || 0;
    for (let i = 0; i < lv; i++) total += metaCost(m, i);
  }
  return total;
}
/* Сумма, вложенная в лабораторию (возврат при сбросе экспериментов) */
function labRefundTotal() {
  let total = 0;
  for (const m of LAB) {
    const lv = (SAVE.lab || {})[m.id] || 0;
    for (let i = 0; i < lv; i++) total += labCost(m, i);
  }
  return total;
}
function repairCost() {
  return Math.max(10, Math.round((45 + G.wave * 6) * G.S.priceMult));
}
function buyRepair() {
  if (G.state !== 'build') return;   // ремонт — только между волнами
  if (G.tower.hp >= G.tower.maxHp - 0.5) { UI.toast('Башня цела'); Sfx.deny(); return; }
  const price = repairCost();
  if (!spendCoins(price)) { Sfx.deny(); UI.toast('Не хватает монет'); return; }
  const heal = Math.round(G.tower.maxHp * 0.35);
  G.tower.hp = Math.min(G.tower.maxHp, G.tower.hp + heal);
  floatText(0, -60, '+' + heal + ' HP', '#7bd948', 20);
  burst(0, 0, 18, '#7bd948', 90);
  ring(0, 0, 60, '#7bd948', 0.5);
  Sfx.heal();
  UI.hudHp(); UI.renderShop();
}
function buyStruct(key) {
  if (G.state !== 'build' && G.state !== 'wave') return;
  const def = STRUCTS[key];
  if (countStructs(key) >= def.max) { UI.toast('Предел построек: ' + def.max); Sfx.deny(); return; }
  const price = structCost(key, G.S.priceMult * G.S.buildMul);
  if (!spendCoins(price)) { Sfx.deny(); UI.toast('Не хватает монет'); return; }
  G.inv[key] = (G.inv[key] || 0) + 1;
  G.placing = key;
  G.strike.aiming = false;
  Sfx.buy();
  UI.renderInv(); UI.hudAbility(); UI.renderShop();
  UI.toast(def.name + ' — выберите место (ПКМ — отмена)');
}

/* ---------- старт забега ---------- */
function startRun() {
  UI.closeModal();
  newRun();
  UI.hud.classList.remove('hidden');
  UI.leftCol.classList.remove('hidden');
  UI.hudAll();
  UI.openShop();
  UI.banner('НОВЫЙ ЗАБЕГ', DIFFS[G.diff].name + ' · монет: ' + fmt(SAVE.coins), DIFFS[G.diff].color);
  if (!SAVE.seenTutorial) { SAVE.seenTutorial = true; markSave(); setTimeout(() => UI.showHelp(true), 500); }
}


/* ===== boot.js ===== */
/* =========================================================
   BOOT: запуск
   ========================================================= */
'use strict';

function boot() {
  canvas = document.getElementById('cv');
  ctx = canvas.getContext('2d', { alpha: false });
  loadSave();
  const sb = document.getElementById('btnSound');
  if (sb) sb.classList.toggle('off', !SAVE.sound);
  UI.init();
  bindInput();
  resize();
  requestAnimationFrame(frame);
  YA.init();    // SDK Яндекс Игр: реклама, покупки, облачные сейвы (без SDK — заглушки)
  YA.ready();   // игра загружена и показана — платформа убирает прелоадер

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      flushSave();   // сейв при сворачивании/закрытии вкладки
      if (G && G.state === 'wave' && !UI.modalOpen) togglePause(true);
    }
  });
  window.addEventListener('pagehide', flushSave);
  window.addEventListener('beforeunload', flushSave);
  window.addEventListener('pagehide', () => YA.writeCloudNow());
  if (Store.degraded()) {
    setTimeout(() => UI.toast('⚠ Хранилище браузера недоступно: прогресс живёт до закрытия вкладки. Откройте index.html в обычной вкладке браузера.'), 700);
  }
  // первый жест — включаем звук
  const kick = () => { Sfx.resume(); window.removeEventListener('pointerdown', kick); window.removeEventListener('keydown', kick); };
  window.addEventListener('pointerdown', kick);
  window.addEventListener('keydown', kick);

  /* запрет ландшафта на телефоне: подсказка «поверните» + автопауза забега */
  const orientGuard = () => {
    const phoneL = window.innerWidth < 980 && window.innerWidth > window.innerHeight;
    const hint = document.getElementById('rotateHint');
    if (hint) hint.classList.toggle('show', phoneL);
    if (phoneL && G && (G.state === 'wave' || G.state === 'build')) togglePause();
  };
  window.addEventListener('resize', orientGuard);
  if (window.matchMedia) {
    const mql = window.matchMedia('(orientation: landscape)');
    if (mql.addEventListener) mql.addEventListener('change', orientGuard);
  }
  orientGuard();
}

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
